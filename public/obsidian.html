  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;

  .neon{box-shadow:0 0 0 1px rgba(34,211,238,.5),0 0 28px -6px rgba(34,211,238,.65)}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.55)}
  .chip{border:1px solid rgba(148,163,184,.16);background:rgba(148,163,184,.07)}
  .chip:hover{border-color:rgba(34,211,238,.55);color:#a5f3fc}
  .chip.on{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(251,146,60,.18));border-color:rgba(34,211,238,.6);color:#e0f2fe}
  .fld{width:100%;border-radius:.6rem;border:1px solid rgba(148,163,184,.16);background:rgba(2,6,23,.6);padding:6px 9px;font-size:12px;color:#e2e8f0}

<body class="antialiased obsidian-app">
<div class="obsidian-shell relative z-10 flex h-screen w-screen flex-col gap-2.5 p-2.5">

<script>

     STATE      – app-wide mutable state

     GUIDES     – magnetic snapping + smart guide rendering
     LAYERS     – Photoshop-style layer stack
     DRAWER     – left panels (text / shapes / icons / uploads / colors / artboard)
     INSPECTOR  – right property editors (typography, effects, transform)
     CTXBAR     – floating toolbar above the active selection
     EXPORT     – high-multiplier raster + vector export
   Every module is namespaced so a backend layer can be attached later
   (e.g. persist STATE.doc() to MySQL as JSON).
   ═══════════════════════════════════════════════════════════════════════ */

  ['Violet Dusk','#8b5cf6','#ec4899'],['Obsidian','#1e293b','#020617'],['Solar','#facc15','#fb923c'],

/* ═══════════════════════════ ENGINE ═══════════════════════════ */
const canvas = new fabric.Canvas('board',{
  width:STATE.W, height:STATE.H, backgroundColor:STATE.bg,
  preserveObjectStacking:true, selection:true, stopContextMenu:true, fireRightClick:true

fabric.Object.prototype.set({

  transparentCorners:false, borderColor:'#22d3ee', borderScaleFactor:1.4, padding:2,

const ENGINE = {
  resize(w,h){
    STATE.W=w; STATE.H=h;
    canvas.setDimensions({width:w,height:h});
    $('#statSize').textContent = `${w} × ${h}`;
    ENGINE.applyZoom(STATE.zoom);
  },
  applyZoom(z){
    STATE.zoom = Math.min(5, Math.max(.1, z));
    const el = canvas.getElement().parentNode;                 // fabric wrapper
    el.style.width = (STATE.W*STATE.zoom)+'px';
    el.style.height= (STATE.H*STATE.zoom)+'px';
    canvas.setZoom(STATE.zoom);
    canvas.setDimensions({width:STATE.W*STATE.zoom, height:STATE.H*STATE.zoom});
    $('#zoomLabel').textContent = Math.round(STATE.zoom*100)+'%';
    canvas.requestRenderAll();
  },
  fit(){
    const box = $('#stageWrap').getBoundingClientRect();
    ENGINE.applyZoom(Math.min((box.width-140)/STATE.W,(box.height-140)/STATE.H));
  },
  /* ── history ── */
  snapshot(){
    if(STATE.hLock) return;
    const json = JSON.stringify(canvas.toDatalessJSON(['objectName','name','locked','selectable','evented','blendMode']));
    STATE.history = STATE.history.slice(0, STATE.hIndex+1);
    STATE.history.push(json);
    if(STATE.history.length>60) STATE.history.shift();
    STATE.hIndex = STATE.history.length-1;
  },
  travel(dir){
    const i = STATE.hIndex + dir;
    if(i<0 || i>=STATE.history.length) return;
    STATE.hIndex = i; STATE.hLock = true;
    canvas.loadFromJSON(STATE.history[i], ()=>{
      canvas.renderAll(); STATE.hLock=false; adoptNames(); LAYERS.render(); INSPECTOR.render();
    });
  },
  add(obj,{center=true}={}){
    if(center) obj.set({left:STATE.W/2, top:STATE.H/2, originX:'center', originY:'center'});
    canvas.add(obj); canvas.setActiveObject(obj); canvas.requestRenderAll();
    ENGINE.snapshot(); LAYERS.render(); INSPECTOR.render();
    return obj;
  }
};

/* ═══════════════════════════ GUIDES (magnetic snapping) ═══════════════════════════ */
const GUIDES = {
  lines:[],
  clear(){ this.lines.forEach(l=>canvas.remove(l)); this.lines=[]; },
  draw(x1,y1,x2,y2,color){
    const l = new fabric.Line([x1,y1,x2,y2],{
      stroke:color, strokeWidth:1/STATE.zoom, strokeDashArray:[6/STATE.zoom,5/STATE.zoom],
      selectable:false, evented:false, excludeFromExport:true, objectName:'__guide'
    });
    canvas.add(l); l.bringToFront(); this.lines.push(l);
  },
  handle(target){
    this.clear();
    if(!STATE.snap || !target) return;
    const TOL = 7/STATE.zoom;
    const b = target.getBoundingRect(true,true);
    const me = { l:b.left, r:b.left+b.width, cx:b.left+b.width/2, t:b.top, bo:b.top+b.height, cy:b.top+b.height/2 };

    // candidate anchors: canvas centre/edges + every other object
    const vX = [{v:STATE.W/2,c:'#22d3ee'},{v:0,c:'#fb923c'},{v:STATE.W,c:'#fb923c'}];
    const vY = [{v:STATE.H/2,c:'#22d3ee'},{v:0,c:'#fb923c'},{v:STATE.H,c:'#fb923c'}];
    canvas.getObjects().forEach(o=>{
      if(o===target || o.objectName==='__guide') return;
      const r=o.getBoundingRect(true,true);
      vX.push({v:r.left,c:'#f43f5e'},{v:r.left+r.width/2,c:'#f43f5e'},{v:r.left+r.width,c:'#f43f5e'});
      vY.push({v:r.top,c:'#f43f5e'},{v:r.top+r.height/2,c:'#f43f5e'},{v:r.top+r.height,c:'#f43f5e'});
    });

    let dx=null,dy=null,cx=null,cy=null;
    vX.forEach(g=>[['l',me.l],['cx',me.cx],['r',me.r]].forEach(([,val])=>{
      if(dx===null && Math.abs(val-g.v)<TOL){ dx = g.v-val; cx=g; }
    }));
    vY.forEach(g=>[['t',me.t],['cy',me.cy],['bo',me.bo]].forEach(([,val])=>{
      if(dy===null && Math.abs(val-g.v)<TOL){ dy = g.v-val; cy=g; }
    }));

    if(dx!==null){ target.left += dx; this.draw(cx.v,-4000,cx.v,4000,cx.c); }
    if(dy!==null){ target.top  += dy; this.draw(-4000,cy.v,4000,cy.v,cy.c); }
    if(dx!==null||dy!==null) target.setCoords();
  }
};

const FACTORY = {
  text(str, opts={}){
    const t = new fabric.Textbox(str,Object.assign({
      width: Math.min(760, STATE.W*0.74), fontFamily:'Sora', fontSize:78, fontWeight:'800',
      fill:'#f8fafc', textAlign:'center', lineHeight:1.15, charSpacing:0, objectName:'Text'
    },opts));
    return ENGINE.add(t);
  },
  rect(r=18){ return ENGINE.add(new fabric.Rect({width:420,height:280,rx:r,ry:r,fill:'#22d3ee',objectName:'Rectangle'})); },
  circle(){ return ENGINE.add(new fabric.Circle({radius:170,fill:'#fb923c',objectName:'Circle'})); },
  triangle(){ return ENGINE.add(new fabric.Triangle({width:320,height:300,fill:'#8b5cf6',objectName:'Triangle'})); },
  ellipse(){ return ENGINE.add(new fabric.Ellipse({rx:230,ry:150,fill:'#34d399',objectName:'Ellipse'})); },
  line(){ return ENGINE.add(new fabric.Line([0,0,460,0],{stroke:'#e2e8f0',strokeWidth:8,strokeLineCap:'round',objectName:'Line'})); },
  bezier(){
    const p = new fabric.Path('M 0 120 C 120 -40, 260 240, 400 60',{
      fill:'', stroke:'#22d3ee', strokeWidth:8, strokeLineCap:'round', objectName:'Bezier curve'});
    return ENGINE.add(p);
  },
  polygon(sides=6){
    const R=180, pts=[];
    for(let i=0;i<sides;i++){ const a=-Math.PI/2 + i*2*Math.PI/sides; pts.push({x:R*Math.cos(a),y:R*Math.sin(a)}); }
    return ENGINE.add(new fabric.Polygon(pts,{fill:'#6366f1',objectName:sides+'-gon'}));
  },
  star(points=5){
    const R=185,r=R*0.45,pts=[];
    for(let i=0;i<points*2;i++){ const rad=i%2?r:R, a=-Math.PI/2+i*Math.PI/points; pts.push({x:rad*Math.cos(a),y:rad*Math.sin(a)}); }
    return ENGINE.add(new fabric.Polygon(pts,{fill:'#facc15',objectName:'Star'}));
  },
  icon(key,color='#e2e8f0'){
    const p = new fabric.Path(ICON_PATHS[key],{fill:color,objectName:'Icon · '+key});
    p.scaleToWidth(150);
    return ENGINE.add(p);
  },
  image(url,name='Image'){
    fabric.Image.fromURL(url,img=>{
      img.set({objectName:name});
      img.scaleToWidth(Math.min(STATE.W*0.7, img.width));
      ENGINE.add(img);
    },{crossOrigin:'anonymous'});
  },
  svg(text,name='Vector'){
    fabric.loadSVGFromString(text,(objs,opts)=>{
      const g = fabric.util.groupSVGElements(objs,opts);
      g.set({objectName:name}); g.scaleToWidth(Math.min(STATE.W*0.6, 620));
      ENGINE.add(g);
    });
  }
};

/* ═══════════════════════════ LAYERS ═══════════════════════════ */
const LAYERS = {
  render(){
    const host = $('#layers');
    const objs = canvas.getObjects().filter(o=>o.objectName!=='__guide');
    if(!objs.length){ host.innerHTML='<p class="px-1 py-2 text-[11px] text-slate-500">Canvas is empty. Add text, shapes or uploads.</p>'; return; }
    const active = canvas.getActiveObject();
    host.innerHTML = objs.slice().reverse().map(o=>{
      const i = canvas.getObjects().indexOf(o);
      const kind = o.objectName && o.objectName!=='Object' ? o.objectName : ((o.type==='textbox'||o.type==='i-text') ? (o.text||'').slice(0,20) : o.type);
      return `<div class="lyr tr flex items-center gap-1.5 rounded-lg px-2 py-1.5 ${o===active?'sel':''}" draggable="true" data-idx="${i}">
        <span class="cursor-grab text-[11px] text-slate-600">⣿</span>
        <button class="tr text-[12px]" data-vis="${i}" title="Visibility">${o.visible?'👁':'🚫'}</button>
        <button class="tr text-[12px]" data-lock="${i}" title="Lock">${o.locked?'🔒':'🔓'}</button>
        <span class="min-w-0 flex-1 truncate text-[11.5px] ${o===active?'text-cyan-200':'text-slate-300'}" data-pick="${i}">${kind||'Layer'}</span>
        <input type="range" min="0" max="100" value="${Math.round((o.opacity??1)*100)}" data-op="${i}" style="width:54px;flex:0 0 54px" title="Opacity" />
      </div>`;
    }).join('');

    host.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
      const o = canvas.item(+el.dataset.pick); canvas.setActiveObject(o); canvas.requestRenderAll();
    });
    host.querySelectorAll('[data-vis]').forEach(el=>el.onclick=()=>{
      const o=canvas.item(+el.dataset.vis); o.visible=!o.visible; canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render();
    });
    host.querySelectorAll('[data-lock]').forEach(el=>el.onclick=()=>{
      const o=canvas.item(+el.dataset.lock); o.locked=!o.locked;
      o.set({lockMovementX:o.locked,lockMovementY:o.locked,lockRotation:o.locked,lockScalingX:o.locked,lockScalingY:o.locked,hasControls:!o.locked});
      canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render();
    });
    host.querySelectorAll('[data-op]').forEach(el=>el.oninput=()=>{
      canvas.item(+el.dataset.op).set('opacity',+el.value/100); canvas.requestRenderAll();
    });

    /* drag-and-drop z-index reordering */
    let dragIdx=null;
    host.querySelectorAll('.lyr').forEach(row=>{
      row.ondragstart = e=>{ dragIdx=+row.dataset.idx; row.classList.add('drag'); e.dataTransfer.effectAllowed='move'; };
      row.ondragend   = ()=>{ row.classList.remove('drag'); host.querySelectorAll('.lyr').forEach(r=>r.classList.remove('over')); };
      row.ondragover  = e=>{ e.preventDefault(); row.classList.add('over'); };
      row.ondragleave = ()=> row.classList.remove('over');
      row.ondrop      = e=>{
        e.preventDefault();
        const target=+row.dataset.idx;
        if(dragIdx===null || dragIdx===target) return;
        canvas.moveTo(canvas.item(dragIdx), target);
        canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render();
      };
    });
  }
};

const ALIGN = {
  ops:[
    ['⬅','left',   o=>o.set({left:o.getBoundingRect(true,true).width/2*0+ (o.originX==='center'? o.getScaledWidth()/2 : 0)})],
    ['↔','centerH',o=>o.set({left: STATE.W/2 - (o.originX==='center'?0:o.getScaledWidth()/2)})],
    ['➡','right',  o=>o.set({left: STATE.W - (o.originX==='center'? o.getScaledWidth()/2 : o.getScaledWidth())})],
    ['⬆','top',    o=>o.set({top: (o.originY==='center'? o.getScaledHeight()/2 : 0)})],
    ['↕','centerV',o=>o.set({top: STATE.H/2 - (o.originY==='center'?0:o.getScaledHeight()/2)})],
    ['⬇','bottom', o=>o.set({top: STATE.H - (o.originY==='center'? o.getScaledHeight()/2 : o.getScaledHeight())})],
    ['⤒','front',  o=>o.bringToFront()],
    ['⤓','back',   o=>o.sendToBack()]
  ],
  render(){
    $('#alignGrid').innerHTML = this.ops.map((o,i)=>
      `<button class="chip tr rounded-lg py-1.5 text-[13px]" data-al="${i}" title="${o[1]}">${o[0]}</button>`).join('');
    $$('#alignGrid [data-al]').forEach(b=>b.onclick=()=>{
      const o = canvas.getActiveObject(); if(!o) return toast('Select an object first');
      this.ops[+b.dataset.al][2](o); o.setCoords(); canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render();
    });
  }
};

function specThumb(t){
  const cols=t.cols.length,rows=t.rows.length+1;
  let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const isH=r===0, isHL=t.hl&&c===t.hl;
    cells+=`<div style="background:${isH?t.head:(isHL?(t.hlFill||t.cell):t.cell)};border:.5px solid ${t.grid}"></div>`;
  }
  const centered=t.layout==='banner'||t.layout==='minimal';
  const headText=t.light?t.head:'#ffffff';
  const band=t.layout==='banner'?`<div style="position:absolute;left:0;right:0;top:0;height:26%;background:${t.head}"></div>`:'';
  return `<div style="position:absolute;inset:0;background:linear-gradient(135deg,${t.bg[0]},${t.bg[1]})"></div>${band}
    <div style="position:absolute;left:6%;right:6%;top:9%;color:${t.layout==='banner'?t.headText:headText};font-family:'Sora';font-weight:800;font-size:10px;letter-spacing:1px;text-align:${centered?'center':'left'};white-space:nowrap;overflow:hidden">${t.model}</div>
    <div style="position:absolute;left:6%;right:6%;top:32%;bottom:10%;display:grid;grid-template-columns:${t.cols.length>1?`1.4fr repeat(${cols-1},1fr)`:'1fr'};grid-auto-rows:1fr;gap:1px">${cells}</div>`;
}

/* Single geometry engine → identical, pixel-aligned output for every theme. */
function buildSpecTemplate(t){
  resizeArtboard(t.w,t.h);
  canvas.clear(); canvas.backgroundColor=t.bg[0];
  const W=t.w,H=t.h,add=o=>canvas.add(o);
  const M=100;                                  // page margin
  const layout=t.layout||'classic';
  const light=t.light!==undefined?t.light:(t.id==='spec-light');
  const brandColor=light?'#16294b':'#ffffff';
  const subColor=light?'#2c4f86':'#b9c7e2';
  const centered=layout==='banner'||layout==='minimal';

  add(new fabric.Rect({left:0,top:0,width:W,height:H,name:'Backdrop',selectable:true,
    fill:new fabric.Gradient({type:'linear',coords:{x1:0,y1:0,x2:W,y2:H},colorStops:[{offset:0,color:t.bg[0]},{offset:1,color:t.bg[1]}]})}));

  /* ── header block ── */
  let headerBottom;
  if(layout==='banner'){
    add(new fabric.Rect({left:0,top:0,width:W,height:250,fill:t.head,name:'Brand Band'}));
    add(new fabric.Textbox(t.brand,{left:M,top:58,width:W-2*M,fontSize:30,fontFamily:t.brandFont,fontWeight:'600',
      fill:t.headText,charSpacing:400,textAlign:'center',name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M,top:104,width:W-2*M,fontSize:76,fontFamily:t.brandFont,fontWeight:'800',
      fill:t.headText,charSpacing:60,textAlign:'center',name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M,top:196,width:W-2*M,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:t.headText,opacity:.8,charSpacing:180,textAlign:'center',name:'Tagline'}));
    headerBottom=250;
  } else if(layout==='minimal'){
    add(new fabric.Textbox(t.brand,{left:M,top:86,width:W-2*M,fontSize:28,fontFamily:t.brandFont,fontWeight:'600',
      fill:t.accent||subColor,charSpacing:420,textAlign:'center',name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M,top:132,width:W-2*M,fontSize:82,fontFamily:t.brandFont,fontWeight:'800',
      fill:brandColor,charSpacing:40,textAlign:'center',name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M,top:232,width:W-2*M,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:subColor,charSpacing:180,textAlign:'center',name:'Tagline'}));
    headerBottom=286;
  } else if(layout==='split'){
    add(new fabric.Rect({left:M,top:96,width:8,height:150,fill:t.accent||t.headText,name:'Accent Bar'}));
    add(new fabric.Textbox(t.brand,{left:M+34,top:100,width:900,fontSize:28,fontFamily:t.brandFont,fontWeight:'600',
      fill:t.accent||subColor,charSpacing:400,name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M+30,top:142,width:1100,fontSize:80,fontFamily:t.brandFont,fontWeight:'800',
      fill:brandColor,charSpacing:40,name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M+34,top:242,width:1100,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:subColor,charSpacing:160,name:'Tagline'}));
    headerBottom=296;
  } else {
    add(new fabric.Textbox(t.brand,{left:M,top:92,width:900,fontSize:30,fontFamily:t.brandFont,fontWeight:'600',
      fill:brandColor,charSpacing:400,name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M-4,top:138,width:1100,fontSize:92,fontFamily:t.brandFont,fontWeight:'800',
      fill:brandColor,charSpacing:50,name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M,top:250,width:1100,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:subColor,charSpacing:160,name:'Tagline'}));
    headerBottom=292;
  }

  /* ── table geometry (kept on a strict grid so nothing drifts) ── */
  const cols=t.cols.length, rows=t.rows.length;
  const badgeH=t.badges?150:0;
  const tx=M, ty=headerBottom+56;
  const tw=W-2*M;
  const avail=H-ty-badgeH-M*0.6;
  const rowH=Math.floor(Math.min(88,avail/(rows+1)));
  const th=rowH*(rows+1);
  const labelW=Math.round(tw*0.26), colW=(tw-labelW)/(cols-1);
  const colX=i=>tx+(i===0?0:labelW+(i-1)*colW);
  const colWidth=i=>i===0?labelW:colW;
  const pad=18;

  if(layout!=='minimal')
    add(new fabric.Rect({left:tx-18,top:ty-18,width:tw+36,height:th+36,rx:24,ry:24,fill:t.panel,
      stroke:t.grid,strokeWidth:1,name:'Table Panel'}));

  /* highlight column glow */
  if(t.hl)
    add(new fabric.Rect({left:colX(t.hl),top:ty-10,width:colWidth(t.hl),height:th+20,rx:14,ry:14,
      fill:'transparent',stroke:t.hlText,strokeWidth:2,opacity:.75,name:'Highlight Frame'}));

  const cellText=(txt,x,y,w,opts)=>add(new fabric.Textbox(txt,Object.assign({
    left:x+w/2, top:y+rowH/2, width:w-pad*2, originX:'center', originY:'center',
    fontFamily:'Inter', textAlign:'center', splitByGrapheme:false
  },opts)));

  for(let c=0;c<cols;c++){
    const isHL=t.hl&&c===t.hl;
    add(new fabric.Rect({left:colX(c),top:ty,width:colWidth(c),height:rowH,fill:isHL?t.hlFill:t.head,
      stroke:t.grid,strokeWidth:1,name:'Header '+(c+1)}));
    cellText(t.cols[c],colX(c),ty,colWidth(c),{fontSize:24,fontWeight:'700',
      fill:isHL?t.hlText:t.headText,name:'Head · '+t.cols[c]});
  }
  t.rows.forEach((row,r)=>{
    const y=ty+rowH*(r+1);
    row.forEach((val,c)=>{
      const isHL=t.hl&&c===t.hl;
      const zebra=r%2===1;
      const fill=isHL?(t.hlFill+'55'):(zebra?(light?'rgba(16,29,54,0.04)':'rgba(255,255,255,0.05)'):t.cell);
      add(new fabric.Rect({left:colX(c),top:y,width:colWidth(c),height:rowH,fill,stroke:t.grid,strokeWidth:1,
        name:'Cell '+(r+1)+'-'+(c+1)}));
      cellText(val,colX(c),y,colWidth(c),{fontSize:22,fontWeight:c===0?'700':'400',
        fill:isHL?t.hlText:t.cellText,
        textAlign:c===0?'left':'center',
        left:c===0?colX(c)+pad:colX(c)+colWidth(c)/2,
        originX:c===0?'left':'center',
        name:'Cell text'});
    });
  });

  /* ── badge strip, evenly distributed ── */
  if(t.badges){
    const n=t.badges.length, gap=24;
    const bw=(tw-gap*(n-1))/n, by=ty+th+52, bh=84;
    t.badges.forEach((b,i)=>{
      const bx=tx+(bw+gap)*i;
      add(new fabric.Rect({left:bx,top:by,width:bw,height:bh,rx:18,ry:18,fill:t.panel,
        stroke:t.grid,strokeWidth:1,name:'Badge '+(i+1)}));
      add(new fabric.Circle({left:bx+42,top:by+bh/2,radius:22,originX:'center',originY:'center',
        fill:'transparent',stroke:t.accent||(light?'#2c4f86':'#e3c48a'),strokeWidth:2,name:'Badge ring'}));
      add(new fabric.Textbox(b,{left:bx+76,top:by+bh/2,width:bw-96,originY:'center',fontSize:19,
        fontFamily:'Inter',fontWeight:'600',fill:light?'#16294b':t.cellText,name:'Badge label'}));
    });
  }
  canvas.discardActiveObject();
  canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

/* One geometry engine for every card sheet → perfectly aligned rows every time. */
function buildCardTemplate(t){
  resizeArtboard(t.w,t.h);
  canvas.clear(); canvas.backgroundColor=t.bg[0];
  const W=t.w,H=t.h,add=o=>canvas.add(o),M=88;
  add(new fabric.Rect({left:0,top:0,width:W,height:H,name:'Backdrop',
    fill:new fabric.Gradient({type:'linear',coords:{x1:0,y1:0,x2:W,y2:H},colorStops:[{offset:0,color:t.bg[0]},{offset:1,color:t.bg[1]}]})}));

  /* frosted outer frame keeps every layout on the same optical grid */
  add(new fabric.Rect({left:M-28,top:120,width:W-2*(M-28),height:H-260,rx:44,ry:44,
    fill:t.light?'rgba(255,255,255,0.45)':'rgba(255,255,255,0.05)',stroke:t.cardStroke,strokeWidth:2,name:'Glass Frame'}));

  add(new fabric.Textbox(t.brand,{left:M,top:150,width:W-2*M,fontSize:22,fontFamily:'Sora',fontWeight:'600',
    charSpacing:300,fill:t.accent,textAlign:'left',name:'Brand'}));
  add(new fabric.Textbox(t.kicker,{left:M,top:196,width:W-2*M,fontSize:26,fontFamily:'Inter',fontWeight:'500',
    fill:t.bodyC,textAlign:'left',opacity:.9,name:'Kicker'}));
  const titleTop=240;
  add(new fabric.Textbox(t.title,{left:M,top:titleTop,width:W-2*M,fontSize:t.title.length>34?58:72,lineHeight:1.05,
    fontFamily:'Sora',fontWeight:'800',fill:t.titleC,name:'Headline'}));
  let y=titleTop+ (t.title.split('\n').length>1?190:130);

  if(t.cta){
    add(new fabric.Rect({left:M,top:y,width:W-2*M,height:96,rx:14,ry:14,fill:t.tile,stroke:t.cardStroke,strokeWidth:2,name:'CTA Bar'}));
    add(new fabric.Textbox(t.cta,{left:W/2,top:y+48,width:W-2*M-40,originX:'center',originY:'center',fontSize:32,
      fontFamily:'Sora',fontWeight:'700',fill:t.light?'#111827':'#ffffff',textAlign:'center',name:'CTA Label'}));
    y+=132;
  }

  const n=t.rows.length, gap=24;
  const bottom=H-190;
  const fit=(bottom-y-gap*(n-1))/n;
  const cap=t.kind==='quote'||t.kind==='review'?420:(t.kind==='service'?230:200);
  const rowH=Math.min(cap,fit);
  y+=Math.max(0,(fit-rowH)*n/2);
  t.rows.forEach((r,i)=>{
    const ry=y+(rowH+gap)*i, tileW=t.kind==='contact'?150:132;
    const hasTile=t.kind!=='quote';
    if(hasTile){
      add(new fabric.Rect({left:M,top:ry,width:tileW,height:rowH,rx:18,ry:18,fill:t.tile,stroke:t.cardStroke,strokeWidth:1,name:'Icon Tile '+(i+1)}));
      add(new fabric.Textbox(String(r[0]),{left:M+tileW/2,top:ry+rowH/2,width:tileW-20,originX:'center',originY:'center',
        fontSize:t.kind==='step'?52:44,fontFamily:'Sora',fontWeight:'800',textAlign:'center',
        fill:t.light?t.accent:'#ffffff',name:'Icon '+(i+1)}));
    }
    const cx=hasTile?M+tileW+22:M, cw=W-M-cx;
    add(new fabric.Rect({left:cx,top:ry,width:cw,height:rowH,rx:18,ry:18,fill:t.card,stroke:t.cardStroke,strokeWidth:1,name:'Card '+(i+1)}));
    const pad=30;
    if(t.kind==='service'||t.kind==='review'){
      add(new fabric.Textbox(r[1],{left:cx+pad,top:ry+pad,width:cw-pad*2,fontSize:34,fontFamily:'Sora',fontWeight:'700',
        fill:t.light?'#111827':'#ffffff',name:'Row title '+(i+1)}));
      add(new fabric.Textbox(r[2]||'',{left:cx+pad,top:ry+pad+52,width:cw-pad*2,fontSize:25,lineHeight:1.35,
        fontFamily:'Inter',fill:t.bodyC,name:'Row text '+(i+1)}));
    } else if(t.kind==='quote'){
      add(new fabric.Textbox(String(r[0]),{left:cx+pad,top:ry+pad,width:120,fontSize:70,fontFamily:'Sora',fontWeight:'800',
        fill:t.accent,name:'Quote mark'}));
      add(new fabric.Textbox(r[1],{left:cx+pad,top:ry+pad+96,width:cw-pad*2,fontSize:30,lineHeight:1.45,
        fontFamily:'Inter',fontWeight:'600',fill:t.light?'#111827':'#ffffff',name:'Quote'}));
      add(new fabric.Textbox(r[2]||'',{left:cx+pad,top:ry+rowH-64,width:cw-pad*2,fontSize:24,fontFamily:'Inter',
        fill:t.bodyC,name:'Attribution'}));
    } else {
      add(new fabric.Textbox(r[1],{left:cx+pad,top:ry+rowH/2,width:cw-pad*2,originY:'center',fontSize:t.kind==='contact'?30:28,
        lineHeight:1.35,fontFamily:'Inter',fontWeight:t.kind==='contact'?'600':'500',
        fill:t.light?'#111827':'#ffffff',textAlign:t.kind==='contact'?'center':'left',name:'Row text '+(i+1)}));
    }
  });

  add(new fabric.Rect({left:M,top:H-136,width:W-2*M,height:2,fill:t.cardStroke,name:'Footer Rule'}));
  add(new fabric.Textbox(t.foot||t.brand,{left:M,top:H-110,width:W-2*M,fontSize:24,fontFamily:'Inter',fontWeight:'600',
    fill:t.bodyC,textAlign:'center',name:'Footer'}));

  canvas.discardActiveObject(); canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

  if(t.kind==='steps'){

      add(new fabric.Circle({left:M+78,top:ry+61,radius:38,originX:'center',originY:'center',fill:t.ink2,name:'Step badge '+(i+1)}));

        fontFamily:'Inter',fontWeight:'600',fill:t.ink,name:'Step text '+(i+1)}));

  /* footer lockup — shared by every layout */
  if(t.kind!=='statement')add(new fabric.Rect({left:M,top:H-136,width:CW,height:2,fill:t.line,name:'Footer Rule'}));
  add(new fabric.Textbox(t.foot||t.brand,{left:M,top:H-108,width:t.page?CW-160:CW,fontSize:24,fontFamily:'Inter',

    textAlign:'right',fill:t.ink2,name:'Page marker'}));

  canvas.discardActiveObject(); canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

function buildCorpTemplate(t){

  const rgrad=(r,a,b)=>new fabric.Gradient({type:'radial',coords:{x1:r,y1:r,r1:0,x2:r,y2:r,r2:r},colorStops:[{offset:0,color:a},{offset:1,color:b}]});
  const T=(txt,o)=>{const tb=new fabric.Textbox(txt||'',Object.assign({fontFamily:'Inter',fill:t.ink},o));add(tb);return tb};
  const R=o=>{const r=new fabric.Rect(Object.assign({fill:'transparent'},o));add(r);return r};
  const C=o=>{const c=new fabric.Circle(Object.assign({originX:'center',originY:'center'},o));add(c);return c};
  const CARD=(x,y,w,h,name)=>R({left:x,top:y,width:w,height:h,rx:18,ry:18,fill:t.panel,stroke:t.line,strokeWidth:1.5,name,
    shadow:t.light?new fabric.Shadow({color:'rgba(13,35,80,.10)',blur:26,offsetY:10}):null});
  const onDeep=t.light?'#ffffff':t.ink;

  add(new fabric.Rect({left:0,top:0,width:W,height:H,name:'Backdrop',fill:grad(0,0,W*0.5,H,t.bg[0],t.bg[1])}));

      T(it[2],{left:cx+20,top:cy+204,width:cw-40,fontSize:18,lineHeight:1.45,textAlign:'center',fill:t.body,name:'Impact copy '+(i+1)});
    });
    R({left:0,top:H-92,width:W,height:92,fill:t.deep,name:'Question bar'});
    T(t.foot,{left:W/2,top:H-46,width:W-200,originX:'center',originY:'center',fontSize:24,textAlign:'center',fontWeight:'800',charSpacing:30,fill:'#ffffff',name:'Question text'});
  }

  /* ── Vertical timeline brief ── */
  if(t.kind==='timelinebrief'){
    C({left:W*0.94,top:H*0.08,radius:320,opacity:.28,fill:rgrad(320,t.accent,'rgba(0,0,0,0)'),name:'Glow'});
    T(t.brand,{left:M,top:M,width:CW*0.7,fontSize:22,fontWeight:'800',charSpacing:80,fill:t.accent,name:'Brand'});
    R({left:W-M-220,top:M-8,width:220,height:50,rx:25,ry:25,fill:t.deep,name:'Tag pill'});
    T(t.pill,{left:W-M-110,top:M+17,width:200,originX:'center',originY:'center',fontSize:18,textAlign:'center',fontWeight:'700',charSpacing:30,fill:'#ffffff',name:'Tag label'});
    T(t.over,{left:M,top:M+70,width:CW,fontSize:21,fontWeight:'800',charSpacing:80,fill:t.body,name:'Overline'});
    T(t.title,{left:M,top:M+108,width:CW,fontSize:66,lineHeight:1.14,fontFamily:'Sora',fontWeight:'800',name:'Headline'});
    const sy=420, stepH=190, lineX=M+44;
    R({left:lineX,top:sy+40,width:2,height:(t.items.length-1)*stepH,fill:t.line,name:'Timeline rail'});
    (t.items||[]).forEach((it,i)=>{
      const y=sy+i*stepH;
      C({left:lineX+1,top:y+40,radius:34,fill:t.deep,name:'Node '+(i+1)});
      C({left:lineX+1,top:y+40,radius:34,fill:'transparent',stroke:t.accent,strokeWidth:2,name:'Node ring '+(i+1)});
      T(it[0],{left:lineX+1,top:y+38,width:70,originX:'center',originY:'center',fontSize:22,textAlign:'center',fontFamily:'Sora',fontWeight:'800',fill:t.accent,name:'Step no '+(i+1)});
      const cx=lineX+70, cw=W-M-cx;
      CARD(cx,y,cw,150,'Step card '+(i+1));
      T(it[1],{left:cx+30,top:y+26,width:cw-60,fontSize:34,fontFamily:'Sora',fontWeight:'800',name:'Step title '+(i+1)});
      T(it[2],{left:cx+30,top:y+76,width:cw-60,fontSize:20,lineHeight:1.45,fill:t.body,name:'Step copy '+(i+1)});
    });
    R({left:M,top:H-110,width:CW,height:1.5,fill:t.line,name:'Footer rule'});
    T(t.foot,{left:M,top:H-80,width:CW,fontSize:20,fill:t.body,name:'Footer'});
  }

  canvas.discardActiveObject(); canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

      ${['Comparison','Social Cards','Modern Posters','Gradient Glow','Neon Deck','Corporate Brief'].includes(activeCat)?'':secH('Poster starters · 120')+`<div class="grid grid-cols-2 gap-2">${TEMPLATES.filter(t=>activeCat==='All'||t.cat===activeCat).map(t=>`

      <div class="grid grid-cols-3 gap-2">${STATE.uploads.map((u,i)=>

    return `${row('Solid swatches',`<div class="flex flex-wrap gap-1.5">${SWATCHES.map(c=>`<span class="swatch tr" style="background:${c}" data-sw="${c}" title="${c}"></span>`).join('')}</div>`)}
      ${row('Custom colour',`<div class="flex gap-2"><input id="pickColor" type="color" value="#22d3ee" class="h-9 w-12 cursor-pointer rounded-lg border border-white/10 bg-transparent" />
        <input id="hexColor" class="fld" value="#22D3EE" /><button id="applyColor" class="chip tr rounded-lg px-3 text-[11px]">Apply</button></div>
        <p id="rgbOut" class="mt-1 text-[10.5px] text-slate-500">rgb(34, 211, 238)</p>`)}
      ${row('Gradient swatches',`<div class="grid grid-cols-2 gap-2">${GRADIENTS.map((g,i)=>

      ${row('Artboard background',`<div class="flex gap-2"><input id="bgColor" type="color" value="${STATE.bg}" class="h-9 w-12 cursor-pointer rounded-lg border border-white/10 bg-transparent" />

    return `${row('Presets',`<div class="grid grid-cols-2 gap-2">${presets.map(([l,w,h])=>

const DRAWER = {
  open(tab){
    STATE.tab = tab;
    $('#leftDrawer').classList.remove('drawer-collapsed');
    $('#drawerTitle').textContent = {templates:'Templates',text:'Text',shapes:'Shapes',icons:'Icons',uploads:'Uploads',palette:'Colours',canvas:'Artboard'}[tab];
    $('#drawer').innerHTML = PANELS[tab]();
    $('#drawer').classList.add('fadein'); setTimeout(()=>$('#drawer').classList.remove('fadein'),300);
    $$('.railBtn').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
    $$('.railBtn').forEach(b=>b.setAttribute('aria-pressed', b.dataset.tab===tab ? 'true' : 'false'));
    DRAWER.bind(tab);
  },
  bind(tab){
    const d = $('#drawer');
    /* templates */
    if(tab==='templates'){
      const re=()=>DRAWER.open('templates');
      d.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;re();});
      d.querySelectorAll('[data-crgroup]').forEach(b=>b.onclick=()=>{corpGroup=b.dataset.crgroup;re();});
      d.querySelectorAll('[data-dgroup]').forEach(b=>b.onclick=()=>{deckGroup=b.dataset.dgroup;re();});
      d.querySelectorAll('[data-ggroup]').forEach(b=>b.onclick=()=>{glowGroup=b.dataset.ggroup;re();});
      d.querySelectorAll('[data-sgroup]').forEach(b=>b.onclick=()=>{specGroup=b.dataset.sgroup;re();});
      d.querySelectorAll('[data-cgroup]').forEach(b=>b.onclick=()=>{cardGroup=b.dataset.cgroup;re();});
      d.querySelectorAll('[data-pgroup]').forEach(b=>b.onclick=()=>{posterGroup=b.dataset.pgroup;re();});
      d.querySelectorAll('[data-corp]').forEach(b=>b.onclick=()=>runTemplate(()=>buildCorpTemplate(CORP_TEMPLATES.find(x=>x.id===b.dataset.corp))));
      d.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>runTemplate(()=>buildDeckTemplate(DECK_TEMPLATES.find(x=>x.id===b.dataset.deck))));
      d.querySelectorAll('[data-glow]').forEach(b=>b.onclick=()=>runTemplate(()=>buildGlowTemplate(GLOW_TEMPLATES.find(x=>x.id===b.dataset.glow))));
      d.querySelectorAll('[data-poster]').forEach(b=>b.onclick=()=>runTemplate(()=>buildPosterTemplate(POSTER_TEMPLATES.find(x=>x.id===b.dataset.poster))));
      d.querySelectorAll('[data-spec]').forEach(b=>b.onclick=()=>runTemplate(()=>buildSpecTemplate(SPEC_TEMPLATES.find(x=>x.id===b.dataset.spec))));
      d.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>runTemplate(()=>buildCardTemplate(CARD_TEMPLATES.find(x=>x.id===b.dataset.card))));
      d.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>runTemplate(()=>buildTemplate(TEMPLATES[+b.dataset.tpl])));
    }
    /* text */
    d.querySelectorAll('[data-addtext]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.addtext;
      const map={head:{fontSize:96,fontWeight:'800',fontFamily:'Sora',objectName:'Heading'},
                 sub:{fontSize:52,fontWeight:'600',fontFamily:'Inter',objectName:'Subheading'},
                 body:{fontSize:30,fontWeight:'400',fontFamily:'Inter',lineHeight:1.45,objectName:'Body text'}};
      FACTORY.text(k==='head'?'Your headline here':k==='sub'?'A supporting subheading':'Body copy — double-click to edit, then highlight any word to restyle only that selection.', map[k]);
    });
    d.querySelectorAll('[data-fcat]').forEach(b=>b.onclick=()=>{ STATE.fontCat=b.dataset.fcat; DRAWER.open('text'); });
    d.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{
      const o=canvas.getActiveObject();
      if(o && o.setSelectionStyles && o.isEditing && o.selectionStart!==o.selectionEnd){
        o.setSelectionStyles({fontFamily:b.dataset.font}); canvas.requestRenderAll(); ENGINE.snapshot(); return toast('Font applied to selection');
      }
      if(o && (o.type==='textbox'||o.type==='i-text')){ o.set('fontFamily',b.dataset.font); canvas.requestRenderAll(); ENGINE.snapshot(); INSPECTOR.render(); }
      else FACTORY.text('Your text', {fontFamily:b.dataset.font});
    });
    /* shapes */
    d.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.shape, r=+($('#newRadius')?.value||18);
      ({rect:()=>FACTORY.rect(0), round:()=>FACTORY.rect(r||36), circle:FACTORY.circle, ellipse:FACTORY.ellipse,
        triangle:FACTORY.triangle, poly5:()=>FACTORY.polygon(5), poly6:()=>FACTORY.polygon(6), poly8:()=>FACTORY.polygon(8),
        star5:()=>FACTORY.star(5), star6:()=>FACTORY.star(6), line:FACTORY.line, bezier:FACTORY.bezier})[k]();
    });
    /* icons */
    d.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>FACTORY.icon(b.dataset.icon,'#e2e8f0'));
    /* uploads */
    if(tab==='uploads'){
      const dz=$('#dropZone');
      dz.onclick=()=>$('#fileInput').click();
      ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('border-cyan-400');}));
      ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('border-cyan-400');}));
      dz.addEventListener('drop',e=>UPLOAD.files(e.dataTransfer.files));
      d.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{
        const u=STATE.uploads[+b.dataset.up];
        u.svg ? FACTORY.svg(u.svg,u.name) : FACTORY.image(u.url,u.name);
      });
    }
    /* palette */
    if(tab==='palette'){
      const setC=(hex)=>{
        const o=canvas.getActiveObject();
        if(!o) return toast('Select an object to colour it');
        if(o.setSelectionStyles && o.isEditing && o.selectionStart!==o.selectionEnd){ o.setSelectionStyles({fill:hex}); toast('Colour applied to selection'); }
        else o.set(o.type==='line'||o.type==='path'&&!o.fill ? 'stroke':'fill', hex);
        canvas.requestRenderAll(); ENGINE.snapshot(); INSPECTOR.render();
      };
      d.querySelectorAll('[data-sw]').forEach(s=>s.onclick=()=>setC(s.dataset.sw));
      const sync=(hex)=>{ $('#pickColor').value=hex; $('#hexColor').value=hex.toUpperCase();
        const n=parseInt(hex.slice(1),16); $('#rgbOut').textContent=`rgb(${n>>16&255}, ${n>>8&255}, ${n&255})`; };
      $('#pickColor').oninput=e=>sync(e.target.value);
      $('#hexColor').onchange=e=>{ if(/^#?[0-9a-f]{6}$/i.test(e.target.value)) sync(e.target.value.startsWith('#')?e.target.value:'#'+e.target.value); };
      $('#applyColor').onclick=()=>setC($('#pickColor').value);
      d.querySelectorAll('[data-grad]').forEach(b=>b.onclick=()=>{
        const g=GRADIENTS[+b.dataset.grad]; STATE.activeGrad=g;
        const o=canvas.getActiveObject(); if(!o) return toast('Gradient stored — select an object to apply');
        o.set('fill', new fabric.Gradient({type:'linear',
          coords:{x1:0,y1:0,x2:o.width,y2:o.height},
          colorStops:[{offset:0,color:g[1]},{offset:1,color:g[2]}]}));
        canvas.requestRenderAll(); ENGINE.snapshot();
      });
      $('#bgColor').oninput=e=>{ STATE.bg=e.target.value; canvas.setBackgroundColor(STATE.bg,()=>canvas.requestRenderAll()); };
      $('#bgGrad').onclick=()=>{
        const g=STATE.activeGrad||GRADIENTS[0];
        canvas.setBackgroundColor(new fabric.Gradient({type:'linear',
          coords:{x1:0,y1:0,x2:STATE.W,y2:STATE.H},
          colorStops:[{offset:0,color:g[1]},{offset:1,color:g[2]}]}),()=>canvas.requestRenderAll());
        ENGINE.snapshot();
      };
    }
    /* artboard */
    if(tab==='canvas'){
      d.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
        const [w,h]=b.dataset.preset.split('x').map(Number); ENGINE.resize(w,h); ENGINE.fit(); DRAWER.open('canvas');
      });

/* ═══════════════════════════ UPLOADS ═══════════════════════════ */
const UPLOAD = {
  files(list){
    [...list].forEach(f=>{
      const rd=new FileReader();
      rd.onload=()=>{
        if(f.type==='image/svg+xml'){ STATE.uploads.unshift({name:f.name,url:rd.result,svg:atob(rd.result.split(',')[1]||'')||''}); }
        else STATE.uploads.unshift({name:f.name,url:rd.result});
        if(STATE.tab==='uploads') DRAWER.open('uploads');
        const u=STATE.uploads[0]; u.svg ? FACTORY.svg(u.svg,u.name) : FACTORY.image(u.url,u.name);
        toast(f.name+' added');
      };
      f.type==='image/svg+xml' ? rd.readAsDataURL(f) : rd.readAsDataURL(f);
    });
  }
};
$('#fileInput').onchange = e=>{ UPLOAD.files(e.target.files); e.target.value=''; };

    const styled=(patch)=>{ // rich-text aware setter
      if(o.setSelectionStyles && o.isEditing && o.selectionStart!==o.selectionEnd){ o.setSelectionStyles(patch); }
      else o.set(patch);
      push();
    };

    if(isText){
      $('#tFont').onchange = e=>styled({fontFamily:e.target.value});
      $('#tSize').onchange = e=>styled({fontSize:Math.max(6,+e.target.value||o.fontSize)});
      $$('#inspector [data-align]').forEach(b=>b.onclick=()=>{ o.set('textAlign',b.dataset.align); push(); INSPECTOR.render(); });
      $$('#inspector [data-tstyle]').forEach(b=>b.onclick=()=>{
        const k=b.dataset.tstyle;
        const cur = (o.isEditing && o.selectionStart!==o.selectionEnd) ? (o.getSelectionStyles()[0]||{}) : o;

        if(k==='italic')    styled({fontStyle: cur.fontStyle==='italic'?'normal':'italic'});
        if(k==='underline') styled({underline: !cur.underline});
        if(k==='linethrough')styled({linethrough: !cur.linethrough});

      $('#tTrack').oninput = e=>{ o.set('charSpacing',+e.target.value); canvas.requestRenderAll(); };
      $('#tTrack').onchange= ()=>ENGINE.snapshot();
      $('#tLead').oninput  = e=>{ o.set('lineHeight',+e.target.value/100); canvas.requestRenderAll(); };
      $('#tLead').onchange = ()=>ENGINE.snapshot();
      $('#tFill').oninput  = e=>{ o.set('fill',e.target.value); canvas.requestRenderAll(); };
      $('#tFillSel').onclick=()=>{
        if(!(o.isEditing && o.selectionStart!==o.selectionEnd)) return toast('Double-click the text and highlight part of it first');
        o.setSelectionStyles({fill:$('#tFill').value}); push(); toast('Selection recoloured');
      };
    }

    $('#oFill').oninput   = e=>{ o.set('fill',e.target.value); canvas.requestRenderAll(); };
    $('#oFill').onchange  = ()=>ENGINE.snapshot();
    $('#oStroke').oninput = e=>{ o.set('stroke',e.target.value); canvas.requestRenderAll(); };
    $('#oStrokeW').onchange=e=>{ o.set('strokeWidth',Math.max(0,+e.target.value||0)); push(); };
    if($('#oRadius')) $('#oRadius').oninput = e=>{ o.set({rx:+e.target.value,ry:+e.target.value}); canvas.requestRenderAll(); };
    $('#oOpacity').oninput= e=>{ o.set('opacity',+e.target.value/100); canvas.requestRenderAll(); };
    $('#oAngle').oninput  = e=>{ o.rotate(+e.target.value); canvas.requestRenderAll(); };
    $('#oAngle').onchange = ()=>ENGINE.snapshot();

    const shadow=()=>{
      o.set('shadow', new fabric.Shadow({
        color:$('#shColor').value, blur:+$('#shBlur').value,
        offsetX:+$('#shX').value, offsetY:+$('#shY').value
      }));
      canvas.requestRenderAll();
    };
    ['#shBlur','#shX','#shY'].forEach(s=>{ $(s).oninput=shadow; $(s).onchange=()=>ENGINE.snapshot(); });
    $('#shColor').oninput = shadow;
    $('#shNeon').onclick  = ()=>{ o.set('shadow',new fabric.Shadow({color:$('#shColor').value,blur:46,offsetX:0,offsetY:0})); push(); INSPECTOR.render(); toast('Neon glow applied'); };

    $$('#inspector [data-act]').forEach(b=>b.onclick=()=>{

      push(); INSPECTOR.render();
    });

};

/* ═══════════════════════════ FLOATING CONTEXT TOOLBAR ═══════════════════════════ */
const CTX = {
  update(){
    const bar = $('#ctxBar');
    const o = canvas.getActiveObject();
    if(!o){ bar.classList.add('hidden'); return; }
    const isText = o.type==='textbox'||o.type==='i-text';
    bar.className = 'glass fadein absolute z-30 flex items-center gap-1.5 rounded-2xl px-2.5 py-2';
    bar.style.pointerEvents = 'auto';
    bar.innerHTML = `
      ${isText?`<select class="fld w-32" data-c="font">${Object.values(FONTS).flat().map(f=>`<option ${o.fontFamily===f?'selected':''}>${f}</option>`).join('')}</select>
      <input class="fld w-14" value="${Math.round(o.fontSize)}" data-c="size" />
      <button class="chip tr rounded-lg px-2 py-1.5 text-[12px] font-black" data-c="bold">B</button>
      <button class="chip tr rounded-lg px-2 py-1.5 text-[12px] italic" data-c="italic">I</button>`:''}
      <input type="color" class="h-7 w-9 cursor-pointer rounded-md border border-white/10 bg-transparent" value="${typeof o.fill==='string'&&o.fill?o.fill:'#22d3ee'}" data-c="fill" />
      <button class="chip tr rounded-lg px-2 py-1.5 text-[11px]" data-c="front">⤒</button>
      <button class="chip tr rounded-lg px-2 py-1.5 text-[11px]" data-c="back">⤓</button>
      <button class="chip tr rounded-lg px-2 py-1.5 text-[11px]" data-c="dup">⧉</button>
      <button class="chip tr rounded-lg px-2 py-1.5 text-[11px] text-rose-300" data-c="del">🗑</button>`;

    // position above the selection, clamped inside the stage
    const r = o.getBoundingRect();
    const wrapRect = $('#stageWrap').getBoundingClientRect();
    const canvRect = canvas.getElement().getBoundingClientRect();
    const x = canvRect.left - wrapRect.left + r.left + r.width/2;
    const y = canvRect.top  - wrapRect.top  + r.top - 56;
    bar.style.left = Math.max(12, Math.min(wrapRect.width-12, x))+'px';
    bar.style.top  = Math.max(8, y)+'px';
    bar.style.transform = 'translateX(-50%)';

    bar.querySelectorAll('[data-c]').forEach(el=>{
      const k=el.dataset.c;
      const sel = ()=> o.isEditing && o.selectionStart!==o.selectionEnd;
      const set = p => { sel()? o.setSelectionStyles(p) : o.set(p); canvas.requestRenderAll(); ENGINE.snapshot(); };
      if(k==='font') el.onchange=e=>set({fontFamily:e.target.value});
      if(k==='size') el.onchange=e=>set({fontSize:Math.max(6,+e.target.value||o.fontSize)});
      if(k==='fill') el.oninput =e=>set({fill:e.target.value});
      if(k==='bold') el.onclick =()=>{ const c=sel()?(o.getSelectionStyles()[0]||{}):o; set({fontWeight:(c.fontWeight==='bold'||c.fontWeight>=700)?'normal':'bold'}); };
      if(k==='italic')el.onclick=()=>{ const c=sel()?(o.getSelectionStyles()[0]||{}):o; set({fontStyle:c.fontStyle==='italic'?'normal':'italic'}); };
      if(k==='front')el.onclick =()=>{ o.bringToFront(); canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render(); };
      if(k==='back') el.onclick =()=>{ o.sendToBack();  canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render(); };
      if(k==='dup')  el.onclick =()=>o.clone(c=>{ c.set({left:(o.left||0)+34,top:(o.top||0)+34,objectName:(o.objectName||'Copy')+' copy'}); canvas.add(c); canvas.setActiveObject(c); canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render(); },['objectName']);
      if(k==='del')  el.onclick =()=>{ canvas.remove(o); canvas.discardActiveObject(); canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render(); INSPECTOR.render(); };
    });
  }
};

/* ═══════════════════════════ EXPORT ═══════════════════════════ */
const EXPORT = {
  run(){
    const fmt = $('#expFormat').value, mult = +$('#expScale').value;
    GUIDES.clear();
    const prevZoom = STATE.zoom;
    ENGINE.applyZoom(1);                                  // render at native resolution
    let url, ext = fmt;
    if(fmt==='svg'){
      url = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(canvas.toSVG());
    } else if(fmt==='json'){
      url = 'data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(canvas.toJSON(['objectName','locked']),null,2));
    } else {
      url = canvas.toDataURL({format:fmt, quality:1, multiplier:mult, enableRetinaScaling:false});
      ext = fmt==='jpeg'?'jpg':'png';
    }
    ENGINE.applyZoom(prevZoom);
    const a=document.createElement('a');
    a.href=url; a.download=`aurora-studio-${STATE.W}x${STATE.H}${fmt==='png'||fmt==='jpeg'?'@'+mult+'x':''}.${ext}`;
    a.click();
    toast(`Exported ${ext.toUpperCase()} · ${STATE.W*(fmt==='svg'||fmt==='json'?1:mult)}×${STATE.H*(fmt==='svg'||fmt==='json'?1:mult)}`);
  }
};

$('#stageWrap').addEventListener('wheel',e=>{

},{passive:false});

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  const o = canvas.getActiveObject();
  const typing = o && o.isEditing;
  if(typing) return;
  const meta = e.ctrlKey||e.metaKey;
  if(meta && e.key.toLowerCase()==='z'){ e.preventDefault(); ENGINE.travel(e.shiftKey?1:-1); }
  if(meta && e.key.toLowerCase()==='d' && o){ e.preventDefault(); o.clone(c=>{c.set({left:(o.left||0)+34,top:(o.top||0)+34}); canvas.add(c); canvas.setActiveObject(c); canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render();},['objectName']); }
  if((e.key==='Delete'||e.key==='Backspace') && o){ e.preventDefault(); canvas.remove(o); canvas.discardActiveObject(); canvas.requestRenderAll(); ENGINE.snapshot(); LAYERS.render(); INSPECTOR.render(); }
  if(o && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault(); const s=e.shiftKey?12:2;
    if(e.key==='ArrowUp') o.top-=s; if(e.key==='ArrowDown') o.top+=s;
    if(e.key==='ArrowLeft') o.left-=s; if(e.key==='ArrowRight') o.left+=s;
    o.setCoords(); canvas.requestRenderAll(); CTX.update();
  }
});
