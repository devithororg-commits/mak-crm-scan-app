<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURORA.STUDIO — Next-Gen Poster Design Studio</title>
<meta name="description" content="AURORA.STUDIO — next-gen poster design studio. Provided by Devithor.org." />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link id="baseFonts" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      navy: { 50:'#eef2f9',100:'#d6e0ef',200:'#b3c4de',400:'#2c4f86',500:'#1e3a67',600:'#16294b',700:'#101d36',800:'#0c1729',900:'#0a1424' },
      flame:{ 300:'#ffb877',400:'#ff9b4d',500:'#ff7a18',600:'#ea6606' }
    },
    fontFamily:{ display:['Sora','sans-serif'], body:['Inter','sans-serif'] }
  }}
}
</script>
<style>
  html,body{height:100%}
  *{scrollbar-width:thin;scrollbar-color:rgba(30,58,103,.28) transparent}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(30,58,103,.25);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,122,24,.6)}
  body{font-family:Inter,sans-serif;background:#f4f7fc;overflow:hidden;color:#101d36}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(700px 460px at 10% 6%, rgba(30,58,103,.10), transparent 62%),
      radial-gradient(760px 520px at 92% 94%, rgba(255,122,24,.13), transparent 62%);}
  .glass{background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(165%);border:1px solid rgba(255,255,255,.75);box-shadow:0 12px 38px -14px rgba(16,29,54,.30)}
  .glass-dark{background:rgba(10,20,36,.86);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.10);box-shadow:0 16px 46px -16px rgba(0,0,0,.6)}
  .soft{box-shadow:0 8px 26px -14px rgba(16,29,54,.45)}
  .glow{box-shadow:0 10px 28px -8px rgba(255,122,24,.75)}
  .tr{transition:all .22s cubic-bezier(.22,1,.36,1)}
  .dock-btn{transition:all .2s cubic-bezier(.22,1,.36,1);position:relative}
  .dock-btn:hover{background:rgba(255,255,255,.10);color:#fff;transform:translateY(-1px)}
  .dock-btn.active{background:linear-gradient(140deg,#ff7a18,#ff9b4d);color:#fff;box-shadow:0 10px 22px -8px rgba(255,122,24,.85)}
  .dock-btn.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:99px;background:#ff9b4d}
  .chip{transition:.18s;border:1px solid rgba(30,58,103,.16)}
  .chip:hover{border-color:#ff7a18;color:#101d36;transform:translateY(-1px)}
  .chip.active{background:#101d36;color:#fff;border-color:#101d36}
  .tpl{transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s}
  .tpl:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 18px 34px -16px rgba(16,29,54,.6)}
  .tpl:hover .tpl-go{opacity:1;transform:translateY(0)}
  .tpl-go{opacity:0;transform:translateY(6px);transition:.24s}
  input[type=range]{-webkit-appearance:none;height:5px;border-radius:99px;background:#e2e8f4;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid #ff7a18;box-shadow:0 2px 8px rgba(255,122,24,.55);cursor:pointer;transition:.15s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
  input[type=color]{-webkit-appearance:none;border:none;width:100%;height:30px;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:1px solid rgba(30,58,103,.2);border-radius:8px}
  .num{width:100%;border:1px solid rgba(30,58,103,.16);border-radius:8px;padding:5px 8px;font-size:12px;background:rgba(255,255,255,.8)}
  .num:focus{outline:none;border-color:#ff7a18;box-shadow:0 0 0 3px rgba(255,122,24,.15)}
  select.num{padding:6px 8px}
  .panel-enter{animation:fadeUp .32s cubic-bezier(.22,1,.36,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #ctxBar{transition:opacity .2s ease, transform .2s cubic-bezier(.22,1,.36,1)}
  #ctxBar.hide{opacity:0;transform:translateY(8px) scale(.97);pointer-events:none}
  .layer-row{transition:.18s;border:1px solid transparent}
  .layer-row:hover{background:rgba(255,255,255,.08)}
  .layer-row.sel{background:rgba(255,122,24,.16);border-color:rgba(255,155,77,.5)}
  .layer-row.dragover{border-top:2px solid #ff7a18}
  .sec-h{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
  .collapsed{width:0!important;min-width:0!important;padding:0!important;border:0!important;overflow:hidden!important}
  .artboard-shadow{box-shadow:0 40px 90px -40px rgba(16,29,54,.55),0 0 0 1px rgba(16,29,54,.08)}
  .drop-active{border-color:#ff7a18!important;background:rgba(255,122,24,.10)!important}
  .spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  .tt{position:relative}
  .tt:hover::after{content:attr(data-tt);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#0a1424;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:60}
</style>
<link rel="stylesheet" href="assets/aurora-responsive.css" />
</head>
<body class="font-body studio-app">
<div class="studio-shell relative z-10 flex h-screen w-screen flex-col">

  <!-- ══ HEADER ══ -->
  <header class="glass-dark m-3 mb-0 flex shrink-0 items-center gap-3 rounded-2xl px-3 py-2 text-white">
    <div class="flex items-center gap-2.5 pr-3">
      <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-flame-500 to-flame-300 font-display text-[15px] font-extrabold text-white glow">A</div>
      <div class="min-w-0 leading-tight">
        <div class="font-display text-[13px] font-bold tracking-tight">AURORA<span class="text-flame-400">.</span>STUDIO</div>
        <div class="text-[9px] uppercase tracking-[.18em] text-navy-200">Provided by Devithor.org</div>
      </div>
    </div>

    <div class="h-7 w-px bg-white/15"></div>

    <div class="flex items-center gap-1">
      <button id="btnUndo" class="dock-btn tt grid h-8 w-8 place-items-center rounded-lg text-navy-100" data-tt="Undo (Ctrl+Z)">↶</button>
      <button id="btnRedo" class="dock-btn tt grid h-8 w-8 place-items-center rounded-lg text-navy-100" data-tt="Redo (Ctrl+Y)">↷</button>
      <span id="histLabel" class="ml-1 hidden rounded-md bg-white/10 px-2 py-1 text-[10px] text-navy-100 md:block">0 / 0</span>
    </div>

    <div class="h-7 w-px bg-white/15"></div>

    <div class="flex items-center gap-1">
      <button id="zOut" class="dock-btn grid h-8 w-8 place-items-center rounded-lg text-navy-100">−</button>
      <input id="zoomRange" type="range" min="10" max="500" value="100" class="w-24 md:w-36" />
      <button id="zIn" class="dock-btn grid h-8 w-8 place-items-center rounded-lg text-navy-100">+</button>
      <span id="zoomVal" class="w-12 text-center text-[11px] font-semibold text-flame-400">100%</span>
      <button id="zFit" class="dock-btn hidden rounded-lg px-2 py-1 text-[10px] font-semibold uppercase tracking-wider text-navy-100 lg:block">Fit</button>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <span id="syncChip" class="hidden items-center gap-1.5 rounded-lg bg-white/10 px-2.5 py-1.5 text-[10px] font-semibold text-navy-100 md:flex">
        <i id="syncDot" class="h-1.5 w-1.5 rounded-full bg-emerald-400"></i><span id="syncTxt">Cloud synced</span>
      </span>
      <button id="btnDesigns" class="dock-btn studio-hide-mobile rounded-lg px-2.5 py-1.5 text-[11px] font-semibold text-navy-100">☁ My Designs</button>
      <button id="btnSave" class="dock-btn rounded-lg px-2.5 py-1.5 text-[11px] font-semibold text-navy-100">💾 Save</button>
      <button id="tglLeft" class="dock-btn flex rounded-lg px-2.5 py-1.5 text-[11px] text-navy-100">◧ <span class="studio-hide-mobile ml-1">Library</span></button>
      <button id="tglRight" class="dock-btn flex rounded-lg px-2.5 py-1.5 text-[11px] text-navy-100"><span class="studio-hide-mobile mr-1">Inspector</span>◨</button>
      <div class="relative">
        <button id="btnExport" class="tr flex items-center gap-2 rounded-xl bg-gradient-to-r from-flame-500 to-flame-400 px-4 py-2 text-[12px] font-bold text-white glow hover:brightness-110">Export ▾</button>
        <div id="expMenu" class="glass absolute right-0 top-11 z-50 hidden w-72 rounded-2xl p-2 text-navy-700 panel-enter">
          <p class="sec-h px-2 py-1.5 text-navy-500/70">Export format</p>
          <button data-exp="png" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">High-Res PNG <span class="text-[10px] text-flame-600">DPI aware</span></button>
          <button data-exp="jpg" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">JPG <span class="text-[10px] text-navy-400">92%</span></button>
          <button data-exp="webp" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">WEBP <span class="text-[10px] text-navy-400">Lossy</span></button>
          <button data-exp="svg" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">SVG Vector</button>
          <button data-exp="pdf" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">Print PDF</button>
          <button data-exp="bleed" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">Print-Ready PDF <span class="text-[10px] text-flame-600">Bleed + marks</span></button>
          <button data-exp="allpdf" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">All Pages → PDF</button>
          <button data-exp="json" class="tr flex w-full items-center justify-between rounded-xl px-3 py-2 text-[12px] font-semibold hover:bg-navy-50">Project JSON</button>
          <div class="mt-1 grid grid-cols-2 gap-2 border-t border-navy-100 px-2 pt-2">
            <label class="text-[10px] font-semibold text-navy-500">DPI
              <select id="expDpi" class="num"><option>72</option><option selected>150</option><option>300</option><option>600</option></select></label>
            <label class="text-[10px] font-semibold text-navy-500">Bleed (px)
              <input id="expBleed" type="number" class="num" value="36" /></label>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ══ BODY ══ -->
  <div class="studio-body flex min-h-0 flex-1 gap-3 p-3">

    <!-- rail -->
    <nav class="studio-rail glass-dark flex w-14 shrink-0 flex-col items-center gap-1.5 rounded-2xl py-3">
      <button data-tab="templates" class="dock-btn tt active grid h-10 w-10 place-items-center rounded-xl text-navy-100" data-tt="Templates">▦</button>
      <button data-tab="text"      class="dock-btn tt grid h-10 w-10 place-items-center rounded-xl text-navy-100 font-display font-bold" data-tt="Typography">T</button>
      <button data-tab="elements"  class="dock-btn tt grid h-10 w-10 place-items-center rounded-xl text-navy-100" data-tt="Elements">◈</button>
      <button data-tab="uploads"   class="dock-btn tt grid h-10 w-10 place-items-center rounded-xl text-navy-100" data-tt="Uploads">⬆</button>
      <button data-tab="bg"        class="dock-btn tt grid h-10 w-10 place-items-center rounded-xl text-navy-100" data-tt="Background">◐</button>
      <button data-tab="canvas"    class="dock-btn tt grid h-10 w-10 place-items-center rounded-xl text-navy-100" data-tt="Artboard">⬚</button>
      <div class="mt-auto text-[9px] uppercase tracking-widest text-navy-200/60" style="writing-mode:vertical-rl">AURORA</div>
    </nav>

    <!-- left panel -->
    <aside id="leftPanel" class="glass tr flex w-[300px] min-w-[300px] flex-col overflow-hidden rounded-2xl">
      <div class="flex items-center justify-between border-b border-navy-100/60 px-4 py-3">
        <h2 id="panelTitle" class="font-display text-[13px] font-bold">Templates</h2>
        <span id="panelSub" class="text-[10px] text-navy-500/70">120 layouts</span>
      </div>
      <div id="panelBody" class="min-h-0 flex-1 overflow-y-auto p-3"></div>
    </aside>

    <!-- stage -->
    <main class="relative min-w-0 flex-1 overflow-hidden rounded-2xl border border-white/60 bg-[radial-gradient(circle_at_1px_1px,rgba(16,29,54,.09)_1px,transparent_0)] [background-size:22px_22px]">
      <!-- rulers -->
      <div id="rulerTop" class="pointer-events-none absolute left-6 right-0 top-0 z-20 hidden h-6 border-b border-navy-100 bg-white/80 text-[8px] text-navy-400 backdrop-blur"></div>
      <div id="rulerLeft" class="pointer-events-none absolute bottom-0 left-0 top-6 z-20 hidden w-6 border-r border-navy-100 bg-white/80 text-[8px] text-navy-400 backdrop-blur"></div>

      <div id="scroller" class="h-full w-full overflow-auto">
        <div id="stage" class="grid min-h-full min-w-full place-items-center p-16">
          <div id="wrap" class="artboard-shadow relative rounded-[4px] bg-white">
            <canvas id="c"></canvas>
            <div id="gridOverlay" class="pointer-events-none absolute inset-0 z-10 hidden"></div>
            <div id="bleedOverlay" class="pointer-events-none absolute inset-0 z-10 hidden border border-dashed border-flame-500/70"></div>
          </div>
        </div>
      </div>

      <!-- view tools -->
      <div class="glass absolute right-4 top-4 z-30 flex items-center gap-1 rounded-xl p-1 text-navy-700">
        <button id="vRuler" class="dock-btn tr rounded-lg px-2 py-1 text-[10px] font-semibold hover:!text-navy-900">Rulers</button>
        <button id="vGrid" class="dock-btn tr rounded-lg px-2 py-1 text-[10px] font-semibold hover:!text-navy-900">Grid</button>
        <button id="vIso" class="dock-btn tr rounded-lg px-2 py-1 text-[10px] font-semibold hover:!text-navy-900">Iso</button>
        <button id="vBleed" class="dock-btn tr rounded-lg px-2 py-1 text-[10px] font-semibold hover:!text-navy-900">Bleed</button>
        <button id="vSnap" class="dock-btn tr active rounded-lg px-2 py-1 text-[10px] font-semibold">Snap</button>
      </div>

      <!-- multi-page artboard bar -->
      <div class="glass-dark absolute bottom-14 left-1/2 z-30 flex max-w-[92%] -translate-x-1/2 items-center gap-2 rounded-2xl px-2.5 py-2 text-white">
        <span class="sec-h shrink-0 text-navy-200">Pages</span>
        <div id="pageStrip" class="flex min-w-0 items-center gap-1.5 overflow-x-auto"></div>
        <button id="pgAdd" class="dock-btn shrink-0 rounded-lg border border-white/10 px-2 py-1 text-[10px] font-semibold">＋ Add</button>
        <button id="pgDup" class="dock-btn shrink-0 rounded-lg border border-white/10 px-2 py-1 text-[10px] font-semibold">⧉ Duplicate</button>
        <button id="pgDel" class="dock-btn shrink-0 rounded-lg border border-white/10 px-2 py-1 text-[10px] font-semibold">✕</button>
      </div>

      <!-- floating context / AI toolbar -->
      <div id="ctxBar" class="glass-dark hide absolute left-1/2 top-4 z-40 w-[min(880px,94%)] -translate-x-1/2 rounded-2xl p-2 text-white">
        <div class="flex flex-wrap items-center gap-1.5">
          <span id="ctxType" class="rounded-lg bg-flame-500/25 px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-flame-300">Object</span>
          <div class="h-6 w-px bg-white/15"></div>
          <div id="ctxText" class="flex flex-wrap items-center gap-1.5">
            <select id="ctxFont" class="num !border-white/15 !bg-white/10 !text-white" style="width:130px"></select>
            <input id="ctxSize" type="number" class="num !border-white/15 !bg-white/10 !text-white" style="width:62px" value="48" />
            <button id="ctxBold" class="dock-btn h-8 w-8 rounded-lg font-bold">B</button>
            <button id="ctxItalic" class="dock-btn h-8 w-8 rounded-lg italic">I</button>
            <button id="ctxUnder" class="dock-btn h-8 w-8 rounded-lg underline">U</button>
            <button data-al="left" class="ctxAlignText dock-btn h-8 w-8 rounded-lg text-[13px]">⯇</button>
            <button data-al="center" class="ctxAlignText dock-btn h-8 w-8 rounded-lg text-[13px]">≡</button>
            <button data-al="right" class="ctxAlignText dock-btn h-8 w-8 rounded-lg text-[13px]">⯈</button>
          </div>
          <input id="ctxColor" type="color" value="#101d36" class="h-8 !w-9 rounded-lg" />
          <div class="h-6 w-px bg-white/15"></div>
          <button id="btnAiBg" class="tr flex items-center gap-1.5 rounded-lg bg-gradient-to-r from-flame-500 to-flame-400 px-2.5 py-1.5 text-[11px] font-bold hover:brightness-110">✦ AI Remove BG</button>
          <button id="btnMagic" class="dock-btn rounded-lg px-2.5 py-1.5 text-[11px] font-semibold">◐ Magic Filters</button>
          <div class="h-6 w-px bg-white/15"></div>
          <div class="flex items-center gap-1">
            <button data-align="left"   class="alignBtn dock-btn tt h-8 w-8 rounded-lg text-[12px]" data-tt="Align left">⇤</button>
            <button data-align="hcenter" class="alignBtn dock-btn h-8 w-8 rounded-lg text-[12px]">⇔</button>
            <button data-align="right"  class="alignBtn dock-btn h-8 w-8 rounded-lg text-[12px]">⇥</button>
            <button data-align="top"    class="alignBtn dock-btn h-8 w-8 rounded-lg text-[12px]">⇡</button>
            <button data-align="vcenter" class="alignBtn dock-btn h-8 w-8 rounded-lg text-[12px]">⇕</button>
            <button data-align="bottom" class="alignBtn dock-btn h-8 w-8 rounded-lg text-[12px]">⇣</button>
          </div>
          <div class="h-6 w-px bg-white/15"></div>
          <button id="ctxDup" class="dock-btn rounded-lg px-2 py-1.5 text-[11px]">⧉ Duplicate</button>
          <button id="ctxGroup" class="dock-btn rounded-lg px-2 py-1.5 text-[11px]">⛶ Group</button>
          <button id="ctxDel" class="tr ml-auto rounded-lg bg-red-500/85 px-2.5 py-1.5 text-[11px] font-bold hover:bg-red-500">🗑 Delete</button>
        </div>
        <div id="magicRow" class="mt-2 hidden grid-cols-2 gap-3 border-t border-white/10 pt-2 md:grid-cols-4">
          <label class="text-[10px] text-navy-100">Brightness <input id="fBright" type="range" min="-100" max="100" value="0" class="w-full"></label>
          <label class="text-[10px] text-navy-100">Contrast <input id="fContrast" type="range" min="-100" max="100" value="0" class="w-full"></label>
          <label class="text-[10px] text-navy-100">Saturation <input id="fSat" type="range" min="-100" max="100" value="0" class="w-full"></label>
          <label class="text-[10px] text-navy-100">Hue <input id="fHue" type="range" min="-100" max="100" value="0" class="w-full"></label>
          <label class="text-[10px] text-navy-100">Blur <input id="fBlur" type="range" min="0" max="100" value="0" class="w-full"></label>
          <label class="text-[10px] text-navy-100">Noise <input id="fNoise" type="range" min="0" max="300" value="0" class="w-full"></label>
          <label class="text-[10px] text-navy-100">Pixelate <input id="fPix" type="range" min="0" max="24" value="0" class="w-full"></label>
          <div class="flex items-end gap-1.5">
            <button id="fGray" class="dock-btn flex-1 rounded-lg px-2 py-1.5 text-[10px]">Grayscale</button>
            <button id="fSepia" class="dock-btn flex-1 rounded-lg px-2 py-1.5 text-[10px]">Sepia</button>
            <button id="fReset" class="dock-btn flex-1 rounded-lg px-2 py-1.5 text-[10px]">Reset</button>
          </div>
        </div>
      </div>

      <!-- status bar -->
      <div class="glass pointer-events-none absolute bottom-3 left-1/2 z-30 flex -translate-x-1/2 items-center gap-3 rounded-full px-4 py-1.5 text-[10px] font-semibold text-navy-600">
        <span id="stSize">1080 × 1350</span><span class="text-navy-200">•</span>
        <span id="stObj">0 objects</span><span class="text-navy-200">•</span>
        <span id="stSel">No selection</span>
      </div>
      <div id="toast" class="glass-dark pointer-events-none absolute bottom-16 left-1/2 z-40 -translate-x-1/2 rounded-xl px-4 py-2 text-[12px] font-semibold text-white opacity-0 transition-opacity duration-300"></div>
    </main>

    <!-- right inspector -->
    <aside id="rightPanel" class="glass-dark tr flex w-[300px] min-w-[300px] flex-col overflow-hidden rounded-2xl text-white">
      <div class="flex shrink-0 items-center gap-2 border-b border-white/10 px-4 py-3">
        <h2 class="font-display text-[13px] font-bold">Inspector</h2>
        <span class="ml-auto rounded-md bg-flame-500/20 px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider text-flame-300">Pro</span>
      </div>

      <!-- layers -->
      <div class="flex min-h-0 shrink-0 flex-col" style="max-height:38%">
        <div class="flex items-center justify-between px-4 pt-3">

<script>
/* ═════════ SETUP ═════════ */
const W0=1080,H0=1350;
const canvas=new fabric.Canvas('c',{width:W0,height:H0,backgroundColor:'#ffffff',preserveObjectStacking:true,selection:true,controlsAboveOverlay:true});

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,1900)};

/* ═════════ FONTS (50+) ═════════ */
const FONTS=['Sora','Inter','Poppins','Montserrat','Playfair Display','Bebas Neue','Oswald','Raleway','Lora','Merriweather','Roboto','Open Sans','Lato','Nunito','Rubik','Work Sans','DM Sans','Space Grotesk','Manrope','Karla','Barlow','Cabin','Quicksand','Josefin Sans','Archivo','Outfit','Figtree','Sora','Anton','Abril Fatface','Cormorant Garamond','Libre Baskerville','Crimson Pro','EB Garamond','Source Serif 4','Bitter','Zilla Slab','Fraunces','Syne','Chivo','Teko','Righteous','Fredoka','Baloo 2','Comfortaa','Pacifico','Lobster','Dancing Script','Great Vibes','Caveat','Permanent Marker','Bangers','Press Start 2P','JetBrains Mono','IBM Plex Mono','Space Mono','Courier Prime'];

(function loadFonts(){
  const url='https://fonts.googleapis.com/css2?'+uniqFonts.map(f=>'family='+f.replace(/ /g,'+')+':wght@400;700').join('&')+'&display=swap';
  const l=document.createElement('link');l.rel='stylesheet';l.href=url;document.head.appendChild(l);
})();

/* ═════════ HISTORY ═════════ */
let hist=[],hIdx=-1,locked=false;
const SNAP_PROPS=['selectable','evented','id','name','hidden','lockMovementX','lockMovementY','blendMode'];
function snapshot(){ if(locked)return; const j=JSON.stringify(canvas.toJSON(SNAP_PROPS)); if(j===hist[hIdx])return;
  hist=hist.slice(0,hIdx+1); hist.push(j); if(hist.length>60)hist.shift(); hIdx=hist.length-1; updHist(); }
function updHist(){ $('#histLabel').textContent=(hIdx+1)+' / '+hist.length; }
function restore(i){ if(i<0||i>=hist.length)return; locked=true; hIdx=i;
  canvas.loadFromJSON(hist[i],()=>{canvas.renderAll();locked=false;updHist();renderLayers();renderInspector();applyBlendModes();}); }
$('#btnUndo').onclick=()=>{restore(hIdx-1);toast('Undo')};
$('#btnRedo').onclick=()=>{restore(hIdx+1);toast('Redo')};

/* ═════════ ZOOM ═════════ */
let zoom=1;
function setZoom(z,silent){ zoom=Math.min(5,Math.max(.1,z));
  canvas.setZoom(zoom); canvas.setDimensions({width:baseW*zoom,height:baseH*zoom});
  $('#zoomVal').textContent=Math.round(zoom*100)+'%'; $('#zoomRange').value=Math.round(zoom*100); if(!silent)canvas.requestRenderAll(); }
let baseW=W0,baseH=H0;
function resizeArtboard(w,h){ baseW=w;baseH=h; setZoom(zoom); $('#stSize').textContent=w+' × '+h; fitZoom(); snapshot(); }
function fitZoom(){ const s=$('#scroller'); const pad=140;
  setZoom(Math.min((s.clientWidth-pad)/baseW,(s.clientHeight-pad)/baseH)); }
$('#zoomRange').oninput=e=>setZoom(e.target.value/100);
$('#zIn').onclick=()=>setZoom(zoom*1.15); $('#zOut').onclick=()=>setZoom(zoom/1.15); $('#zFit').onclick=fitZoom;
$('#scroller').addEventListener('wheel',e=>{ if(!(e.ctrlKey||e.metaKey))return; e.preventDefault();
  const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?100:1); setZoom(zoom*Math.exp(-dy*0.0015)); },{passive:false});

/* ═════════ SMART GUIDES ═════════ */
const guides=[];
function drawGuides(lines){ const ctx=canvas.getSelectionContext(); canvas.clearContext(ctx);
  ctx.save();ctx.strokeStyle='#ff7a18';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  lines.forEach(l=>{ctx.beginPath();ctx.moveTo(l.x1*zoom,l.y1*zoom);ctx.lineTo(l.x2*zoom,l.y2*zoom);ctx.stroke()});ctx.restore(); }
canvas.on('object:moving',e=>{
  if(window.SNAP===false){syncInspectorLive();return}
  const o=e.target,T=8/zoom,lines=[];const b=o.getBoundingRect(true,true);
  const targets=[{cx:baseW/2,cy:baseH/2,l:0,t:0,r:baseW,bo:baseH}];
  canvas.getObjects().forEach(x=>{ if(x===o||x.hidden)return; const r=x.getBoundingRect(true,true);
    targets.push({cx:r.left+r.width/2,cy:r.top+r.height/2,l:r.left,t:r.top,r:r.left+r.width,bo:r.top+r.height}); });
  const oc={cx:b.left+b.width/2,cy:b.top+b.height/2,l:b.left,t:b.top,r:b.left+b.width,bo:b.top+b.height};
  let dx=null,dy=null;
  targets.forEach(t=>{
    [['cx','cx'],['l','l'],['r','r'],['l','r'],['r','l']].forEach(([a,bb])=>{ if(dx===null&&Math.abs(oc[a]-t[bb])<T){dx=t[bb]-oc[a];lines.push({x1:t[bb],y1:0,x2:t[bb],y2:baseH})} });
    [['cy','cy'],['t','t'],['bo','bo'],['t','bo'],['bo','t']].forEach(([a,bb])=>{ if(dy===null&&Math.abs(oc[a]-t[bb])<T){dy=t[bb]-oc[a];lines.push({x1:0,y1:t[bb],x2:baseW,y2:t[bb]})} });
  });
  if(dx)o.left+=dx; if(dy)o.top+=dy;
  if(lines.length)drawGuides(lines); else canvas.clearContext(canvas.getSelectionContext());
  syncInspectorLive();
});
canvas.on('mouse:up',()=>canvas.clearContext(canvas.getSelectionContext()));

}
function buildTemplate(t){
  const [bg,ac,fg]=t.pal; canvas.clear(); canvas.backgroundColor=fg;
  const W=baseW,H=baseH,add=o=>canvas.add(o);
  if(t.layout===0){ const r=new fabric.Rect({left:0,top:0,width:W,height:H,fill:new fabric.Gradient({type:'linear',coords:{x1:0,y1:0,x2:W,y2:H},colorStops:[{offset:0,color:bg},{offset:1,color:ac}]}),selectable:true,name:'Gradient BG'}); add(r); }
  else if(t.layout===1){ add(new fabric.Rect({left:0,top:0,width:W,height:H,fill:bg,name:'Backdrop'}));
    add(new fabric.Circle({left:W/2,top:H*0.36,radius:W*0.32,fill:ac,originX:'center',originY:'center',name:'Orb'})); }
  else if(t.layout===2){ add(new fabric.Rect({left:0,top:0,width:W,height:H*0.42,fill:bg,name:'Header Block'}));
    add(new fabric.Rect({left:W*0.08,top:H*0.86,width:W*0.36,height:12,fill:ac,name:'Rule'})); }
  else if(t.layout===3){ add(new fabric.Rect({left:0,top:0,width:W,height:H,fill:bg,name:'Backdrop'}));
    for(let k=0;k<9;k++) add(new fabric.Rect({left:0,top:H*(0.08+k*0.09),width:W,height:6,fill:ac,opacity:.25+k*.08,name:'Line '+(k+1)})); }
  else if(t.layout===4){ add(new fabric.Rect({left:W*0.09,top:H*0.09,width:W*0.82,height:H*0.82,fill:'transparent',stroke:bg,strokeWidth:8,name:'Frame'}));
    add(new fabric.Rect({left:W*0.39,top:H*0.80,width:W*0.22,height:8,fill:ac,name:'Rule'})); }
  else { add(new fabric.Rect({left:0,top:0,width:W,height:H,fill:new fabric.Gradient({type:'linear',coords:{x1:W,y1:0,x2:0,y2:H},colorStops:[{offset:0,color:ac},{offset:1,color:bg}]}),name:'Gradient BG'}));
    add(new fabric.Rect({left:0,top:H*0.66,width:W,height:H*0.34,fill:fg,opacity:.93,name:'Sheet'})); }
  const dark=[0,1,3,5].includes(t.layout);
  const titleColor=t.layout===2?bg:(dark?fg:bg);
  add(new fabric.Textbox(t.word,{left:W*0.08,top:t.layout===2?H*0.48:H*0.62,width:W*0.84,fontSize:170,fontFamily:t.font,fontWeight:'700',fill:titleColor,name:'Headline',charSpacing:-20}));
  add(new fabric.Textbox(t.sub.toUpperCase(),{left:W*0.085,top:t.layout===2?H*0.40:H*0.55,width:W*0.84,fontSize:38,fontFamily:'Inter',fontWeight:'600',fill:ac,charSpacing:320,name:'Kicker'}));
  add(new fabric.Textbox(t.cat.toUpperCase()+' · AURORA STUDIO',{left:W*0.08,top:H*0.90,width:W*0.84,fontSize:26,fontFamily:'Inter',fill:titleColor,opacity:.75,charSpacing:180,name:'Footer'}));
  canvas.requestRenderAll(); renderLayers(); snapshot(); toast('Template applied');
}

  const cols=t.cols.length,rows=t.rows.length+1;
  let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const isH=r===0, isHL=t.hl&&c===t.hl;
    cells+=`<div style="background:${isH?t.head:(isHL?(t.hlFill||t.cell):t.cell)};border:.5px solid ${t.grid}"></div>`;

/* Single geometry engine → identical, pixel-aligned output for every theme. */
function buildSpecTemplate(t){
  resizeArtboard(t.w,t.h);
  canvas.clear(); canvas.backgroundColor=t.bg[0];
  const W=t.w,H=t.h,add=o=>canvas.add(o);
  const M=100;                                  // page margin
  const layout=t.layout||'classic';
  const light=t.light!==undefined?t.light:(t.id==='spec-light');
  const brandColor=light?'#16294b':'#ffffff';
  const subColor=light?'#2c4f86':'#b9c7e2';
  const centered=layout==='banner'||layout==='minimal';

  add(new fabric.Rect({left:0,top:0,width:W,height:H,name:'Backdrop',selectable:true,
    fill:new fabric.Gradient({type:'linear',coords:{x1:0,y1:0,x2:W,y2:H},colorStops:[{offset:0,color:t.bg[0]},{offset:1,color:t.bg[1]}]})}));

  /* ── header block ── */
  let headerBottom;
  if(layout==='banner'){
    add(new fabric.Rect({left:0,top:0,width:W,height:250,fill:t.head,name:'Brand Band'}));
    add(new fabric.Textbox(t.brand,{left:M,top:58,width:W-2*M,fontSize:30,fontFamily:t.brandFont,fontWeight:'600',
      fill:t.headText,charSpacing:400,textAlign:'center',name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M,top:104,width:W-2*M,fontSize:76,fontFamily:t.brandFont,fontWeight:'800',
      fill:t.headText,charSpacing:60,textAlign:'center',name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M,top:196,width:W-2*M,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:t.headText,opacity:.8,charSpacing:180,textAlign:'center',name:'Tagline'}));
    headerBottom=250;
  } else if(layout==='minimal'){
    add(new fabric.Textbox(t.brand,{left:M,top:86,width:W-2*M,fontSize:28,fontFamily:t.brandFont,fontWeight:'600',
      fill:t.accent||subColor,charSpacing:420,textAlign:'center',name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M,top:132,width:W-2*M,fontSize:82,fontFamily:t.brandFont,fontWeight:'800',
      fill:brandColor,charSpacing:40,textAlign:'center',name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M,top:232,width:W-2*M,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:subColor,charSpacing:180,textAlign:'center',name:'Tagline'}));
    headerBottom=286;
  } else if(layout==='split'){
    add(new fabric.Rect({left:M,top:96,width:8,height:150,fill:t.accent||t.headText,name:'Accent Bar'}));
    add(new fabric.Textbox(t.brand,{left:M+34,top:100,width:900,fontSize:28,fontFamily:t.brandFont,fontWeight:'600',
      fill:t.accent||subColor,charSpacing:400,name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M+30,top:142,width:1100,fontSize:80,fontFamily:t.brandFont,fontWeight:'800',
      fill:brandColor,charSpacing:40,name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M+34,top:242,width:1100,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:subColor,charSpacing:160,name:'Tagline'}));
    headerBottom=296;
  } else {
    add(new fabric.Textbox(t.brand,{left:M,top:92,width:900,fontSize:30,fontFamily:t.brandFont,fontWeight:'600',
      fill:brandColor,charSpacing:400,name:'Brand'}));
    add(new fabric.Textbox(t.model,{left:M-4,top:138,width:1100,fontSize:92,fontFamily:t.brandFont,fontWeight:'800',
      fill:brandColor,charSpacing:50,name:'Model'}));
    add(new fabric.Textbox(t.tag,{left:M,top:250,width:1100,fontSize:22,fontFamily:'Inter',fontWeight:'500',
      fill:subColor,charSpacing:160,name:'Tagline'}));
    headerBottom=292;
  }

  /* ── table geometry (kept on a strict grid so nothing drifts) ── */
  const cols=t.cols.length, rows=t.rows.length;
  const badgeH=t.badges?150:0;
  const tx=M, ty=headerBottom+56;
  const tw=W-2*M;
  const avail=H-ty-badgeH-M*0.6;
  const rowH=Math.floor(Math.min(88,avail/(rows+1)));
  const th=rowH*(rows+1);
  const labelW=Math.round(tw*0.26), colW=(tw-labelW)/(cols-1);
  const colX=i=>tx+(i===0?0:labelW+(i-1)*colW);
  const colWidth=i=>i===0?labelW:colW;
  const pad=18;

  if(layout!=='minimal')
    add(new fabric.Rect({left:tx-18,top:ty-18,width:tw+36,height:th+36,rx:24,ry:24,fill:t.panel,
      stroke:t.grid,strokeWidth:1,name:'Table Panel'}));

  /* highlight column glow */
  if(t.hl)
    add(new fabric.Rect({left:colX(t.hl),top:ty-10,width:colWidth(t.hl),height:th+20,rx:14,ry:14,
      fill:'transparent',stroke:t.hlText,strokeWidth:2,opacity:.75,name:'Highlight Frame'}));

  const cellText=(txt,x,y,w,opts)=>add(new fabric.Textbox(txt,Object.assign({
    left:x+w/2, top:y+rowH/2, width:w-pad*2, originX:'center', originY:'center',
    fontFamily:'Inter', textAlign:'center', splitByGrapheme:false
  },opts)));

  for(let c=0;c<cols;c++){
    const isHL=t.hl&&c===t.hl;
    add(new fabric.Rect({left:colX(c),top:ty,width:colWidth(c),height:rowH,fill:isHL?t.hlFill:t.head,
      stroke:t.grid,strokeWidth:1,name:'Header '+(c+1)}));
    cellText(t.cols[c],colX(c),ty,colWidth(c),{fontSize:24,fontWeight:'700',
      fill:isHL?t.hlText:t.headText,name:'Head · '+t.cols[c]});
  }
  t.rows.forEach((row,r)=>{
    const y=ty+rowH*(r+1);
    row.forEach((val,c)=>{
      const isHL=t.hl&&c===t.hl;
      const zebra=r%2===1;
      const fill=isHL?(t.hlFill+'55'):(zebra?(light?'rgba(16,29,54,0.04)':'rgba(255,255,255,0.05)'):t.cell);
      add(new fabric.Rect({left:colX(c),top:y,width:colWidth(c),height:rowH,fill,stroke:t.grid,strokeWidth:1,
        name:'Cell '+(r+1)+'-'+(c+1)}));
      cellText(val,colX(c),y,colWidth(c),{fontSize:22,fontWeight:c===0?'700':'400',
        fill:isHL?t.hlText:t.cellText,
        textAlign:c===0?'left':'center',
        left:c===0?colX(c)+pad:colX(c)+colWidth(c)/2,
        originX:c===0?'left':'center',
        name:'Cell text'});
    });
  });

  /* ── badge strip, evenly distributed ── */
  if(t.badges){
    const n=t.badges.length, gap=24;
    const bw=(tw-gap*(n-1))/n, by=ty+th+52, bh=84;
    t.badges.forEach((b,i)=>{
      const bx=tx+(bw+gap)*i;
      add(new fabric.Rect({left:bx,top:by,width:bw,height:bh,rx:18,ry:18,fill:t.panel,
        stroke:t.grid,strokeWidth:1,name:'Badge '+(i+1)}));
      add(new fabric.Circle({left:bx+42,top:by+bh/2,radius:22,originX:'center',originY:'center',
        fill:'transparent',stroke:t.accent||(light?'#2c4f86':'#e3c48a'),strokeWidth:2,name:'Badge ring'}));
      add(new fabric.Textbox(b,{left:bx+76,top:by+bh/2,width:bw-96,originY:'center',fontSize:19,
        fontFamily:'Inter',fontWeight:'600',fill:light?'#16294b':t.cellText,name:'Badge label'}));
    });
  }
  canvas.discardActiveObject();
  canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

      add(new fabric.Textbox(r[1],{left:cx+pad,top:ry+pad,width:cw-pad*2,fontSize:34,fontFamily:'Sora',fontWeight:'700',

      add(new fabric.Textbox(r[1],{left:cx+pad,top:ry+pad+96,width:cw-pad*2,fontSize:30,lineHeight:1.45,
        fontFamily:'Inter',fontWeight:'600',fill:t.light?'#111827':'#ffffff',name:'Quote'}));
      add(new fabric.Textbox(r[2]||'',{left:cx+pad,top:ry+rowH-64,width:cw-pad*2,fontSize:24,fontFamily:'Inter',
        fill:t.bodyC,name:'Attribution'}));
    } else {
      add(new fabric.Textbox(r[1],{left:cx+pad,top:ry+rowH/2,width:cw-pad*2,originY:'center',fontSize:t.kind==='contact'?30:28,
        lineHeight:1.35,fontFamily:'Inter',fontWeight:t.kind==='contact'?'600':'500',
        fill:t.light?'#111827':'#ffffff',textAlign:t.kind==='contact'?'center':'left',name:'Row text '+(i+1)}));
    }
  });

  add(new fabric.Rect({left:M,top:H-136,width:W-2*M,height:2,fill:t.cardStroke,name:'Footer Rule'}));
  add(new fabric.Textbox(t.foot||t.brand,{left:M,top:H-110,width:W-2*M,fontSize:24,fontFamily:'Inter',fontWeight:'600',
    fill:t.bodyC,textAlign:'center',name:'Footer'}));

  canvas.discardActiveObject(); canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

/* Shared geometry engine → identical margins, rhythm and alignment everywhere. */
function buildPosterTemplate(t){
  resizeArtboard(t.w,t.h);
  canvas.clear(); canvas.backgroundColor=t.bg[0];
  const W=t.w,H=t.h,M=96,CW=W-2*M,add=o=>canvas.add(o);
  const grad=(x1,y1,x2,y2,a,b)=>new fabric.Gradient({type:'linear',coords:{x1,y1,x2,y2},colorStops:[{offset:0,color:a},{offset:1,color:b}]});

  add(new fabric.Rect({left:0,top:0,width:W,height:H,name:'Backdrop',fill:grad(0,0,W,H,t.bg[0],t.bg[1])}));
  /* soft ambient orbs — the signature of the reference set */
  add(new fabric.Circle({left:W*0.94,top:H*0.30,radius:230,originX:'center',originY:'center',opacity:.55,name:'Glow Orb A',

  /* header lockup */

      lineHeight:.95,fontFamily:'Sora',fontWeight:'800',textAlign:'center',name:'Big Number',
      fill:grad(-CW/2,-200,CW/2,200,t.ink2,t.ink)}));
    add(new fabric.Textbox(t.sub,{left:W/2,top:H-360,width:CW,originX:'center',fontSize:34,fontFamily:'Inter',

      fontWeight:'800',textAlign:'center',fill:t.ink,name:'CTA'}));
  }

  if(t.kind==='statement'){
    add(new fabric.Textbox(t.title,{left:M,top:H*0.33,width:CW,fontSize:150,fontFamily:'Sora',fontWeight:'800',
      name:'Headline',fill:grad(0,0,CW,0,t.ink2,t.ink)}));
    add(new fabric.Textbox(t.sub,{left:M+8,top:H*0.33+168,width:CW-8,fontSize:34,fontFamily:'Inter',fill:t.body,name:'Subline'}));
    (t.rows||[]).forEach((r,i)=>{
      const pw=CW/2-14, px=M+(pw+28)*i, py=H*0.33+240;
      add(new fabric.Rect({left:px,top:py,width:pw,height:66,rx:33,ry:33,fill:'transparent',stroke:t.ink2,strokeWidth:2,name:'Pill '+(i+1)}));
      add(new fabric.Textbox(r[1],{left:px+pw/2,top:py+33,width:pw-32,originX:'center',originY:'center',fontSize:26,
        fontFamily:'Inter',textAlign:'center',fill:t.body,name:'Pill label '+(i+1)}));
    });
    /* arc motif */
    const R=CW*0.52;
    add(new fabric.Circle({left:W/2,top:H+R*0.34,radius:R,originX:'center',originY:'center',startAngle:180,endAngle:360,
      fill:'transparent',stroke:t.ink2,strokeWidth:46,strokeLineCap:'round',name:'Arc'}));
    add(new fabric.Circle({left:W/2,top:H+R*0.34,radius:R,originX:'center',originY:'center',startAngle:180,endAngle:360,
      fill:'transparent',stroke:t.light?'#ffffff':'rgba(255,255,255,.6)',strokeWidth:2,name:'Arc Line'}));
  }

  if(t.kind==='glass'){
    const gx=M-24,gy=H*0.20,gw=W-2*gx,gh=H*0.58;
    add(new fabric.Rect({left:gx,top:gy,width:gw,height:gh,rx:56,ry:56,name:'Glass Card',

    add(new fabric.Textbox(t.sub,{left:gx+64,top:gy+gh-160,width:gw-128,fontSize:30,lineHeight:1.4,fontFamily:'Inter',
      fill:t.body,name:'Subline'}));

  if(t.kind==='matrix'){
    add(new fabric.Textbox(t.title,{left:M,top:y+70,width:CW*0.68,fontSize:84,lineHeight:1.06,fontFamily:'Sora',

      fontWeight:'600',fill:t.ink,name:'Subline'}));
    /* quadrant diagram, right column */
    const qw=(CW*0.42-16)/2, qh=112, qx=M+CW*0.58, qy=y+470;
    ['Urgent','Not Urgent'].forEach((lbl,i)=>add(new fabric.Textbox(lbl,{left:qx+(qw+16)*i+qw/2,top:qy-46,width:qw,
      originX:'center',fontSize:22,fontFamily:'Inter',fill:t.body,textAlign:'center',name:'Axis '+(i+1)})));
    (t.quad||[]).forEach((q,i)=>{
      const cx=qx+(qw+16)*(i%2), cy=qy+(qh+16)*Math.floor(i/2);
      add(new fabric.Rect({left:cx,top:cy,width:qw,height:qh,rx:22,ry:22,name:'Quadrant '+(i+1),
        fill:i===0?t.ink2:(i===3?'transparent':t.soft),stroke:t.line,strokeWidth:2}));
      add(new fabric.Textbox(q,{left:cx+qw/2,top:cy+qh/2,width:qw-20,originX:'center',originY:'center',fontSize:26,
        fontFamily:'Inter',fontWeight:'600',textAlign:'center',fill:i===0?'#ffffff':t.ink,name:'Quadrant label '+(i+1)}));
    });
    (t.rows||[]).forEach((r,i)=>{
      const py=y+470+(112)*i, pw=CW*0.52;
      add(new fabric.Rect({left:M,top:py,width:pw,height:76,rx:38,ry:38,fill:'transparent',stroke:t.ink2,strokeWidth:2,name:'Point '+(i+1)}));
      add(new fabric.Textbox(String(r[0]),{left:M+42,top:py+38,width:44,originX:'center',originY:'center',fontSize:30,
        fontFamily:'Sora',textAlign:'center',fill:t.ink2,name:'Point icon '+(i+1)}));
      add(new fabric.Textbox(r[1],{left:M+80,top:py+38,width:pw-104,originY:'center',fontSize:26,lineHeight:1.2,
        fontFamily:'Inter',fontWeight:'600',fill:t.ink,name:'Point text '+(i+1)}));
    });
  }

  if(t.kind==='pills'){
    add(new fabric.Textbox(t.title,{left:M,top:y+40,width:CW,fontSize:132,lineHeight:.98,fontFamily:'Sora',
      fontWeight:'800',fill:t.ink,name:'Headline'}));
    let px=M, py=y+340;
    (t.rows||[]).forEach((r,i)=>{
      const label=r[1], pw=Math.min(CW, 64+label.length*22), ph=86;
      if(px+pw>M+CW){ px=M; py+=ph+22; }
      const solid=i%2===0;
      add(new fabric.Rect({left:px,top:py,width:pw,height:ph,rx:43,ry:43,name:'Pill '+(i+1),
        fill:solid?(t.light?t.ink:'#ffffff'):'transparent',stroke:t.light?t.ink:'#ffffff',strokeWidth:2}));
      add(new fabric.Textbox(label,{left:px+pw/2,top:py+ph/2,width:pw-40,originX:'center',originY:'center',fontSize:28,
        fontFamily:'Sora',fontWeight:'700',textAlign:'center',
        fill:solid?(t.light?'#ffffff':t.bg[1]):(t.light?t.ink:'#ffffff'),name:'Pill label '+(i+1)}));
      px+=pw+22;
    });
  }

  if(t.kind==='steps'){
    add(new fabric.Textbox(t.title,{left:M,top:y+40,width:CW,fontSize:104,lineHeight:1.04,fontFamily:'Sora',
      fontWeight:'800',name:'Headline',fill:grad(0,0,CW,0,t.ink,t.ink2)}));
    add(new fabric.Textbox(t.sub,{left:M,top:y+280,width:CW*0.8,fontSize:32,fontFamily:'Inter',fill:t.body,name:'Subline'}));
    (t.rows||[]).forEach((r,i)=>{

      add(new fabric.Textbox(String(r[0]),{left:M+78,top:ry+61,width:60,originX:'center',originY:'center',fontSize:34,
        fontFamily:'Sora',fontWeight:'800',textAlign:'center',fill:'#ffffff',name:'Step number '+(i+1)}));
      add(new fabric.Textbox(r[1],{left:M+142,top:ry+61,width:CW-190,originY:'center',fontSize:28,lineHeight:1.3,
        fontFamily:'Inter',fontWeight:'600',fill:t.ink,name:'Step text '+(i+1)}));
    });
  }

  /* footer lockup — shared by every layout */
  if(t.kind!=='statement')add(new fabric.Rect({left:M,top:H-136,width:CW,height:2,fill:t.line,name:'Footer Rule'}));
  add(new fabric.Textbox(t.foot||t.brand,{left:M,top:H-108,width:t.page?CW-160:CW,fontSize:24,fontFamily:'Inter',
    fontWeight:'600',textAlign:t.kind==='statement'?'center':'left',fill:t.body,name:'Footer'}));
  if(t.page)add(new fabric.Textbox(t.page,{left:M,top:H-108,width:CW,fontSize:24,fontFamily:'Inter',fontWeight:'700',
    textAlign:'right',fill:t.ink2,name:'Page marker'}));

  canvas.discardActiveObject(); canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

      <div style="position:absolute;left:-10%;top:38%;width:34%;height:26%;border-radius:50%;background:${t.ink2};filter:blur(9px);opacity:.6"></div>`,

    process:`${[0,1,2,3].map(i=>`<div style="position:absolute;left:${9+(i%2)*42}%;top:${44+Math.floor(i/2)*24}%;width:38%;height:20%;border-radius:6px;background:${glass};border:.5px solid ${t.line}"></div>`).join('')}`,

    eventposter:`<div style="position:absolute;left:22%;top:26%;width:56%;height:44%;border-radius:50%;background:${t.ink2};filter:blur(12px);opacity:.45"></div>
      <div style="position:absolute;left:8%;right:8%;bottom:16%;height:1px;background:${t.line}"></div>`,

      <div style="position:absolute;left:12%;top:64%;width:26%;height:10px;border-radius:3px;background:${t.ink2}"></div>`
  }[t.kind]||'';

    R({left:M+16,top:H*0.47,width:70,height:12,fill:t.ink2,name:'Accent rule'});
    T(t.sub,{left:M+16,top:H*0.52,width:CW*0.78,fontSize:28,lineHeight:1.55,fill:t.body,name:'Body copy'});
    const by=H*0.66;

    T(t.cta,{left:M+181,top:by+30,width:310,originX:'center',originY:'center',fontSize:24,fontWeight:'700',textAlign:'center',

    add(new fabric.Circle({left:W-M-110,top:H*0.78,radius:96,originX:'center',originY:'center',fill:t.ink2,opacity:.92,name:'Seal'}));
    T('INNOVATING\nBRANDS',{left:W-M-110,top:H*0.78,width:170,originX:'center',originY:'center',fontSize:20,lineHeight:1.3,
      charSpacing:60,textAlign:'center',fontWeight:'700',fill:t.light?'#ffffff':'#08120c',name:'Seal label'});
    R({left:M,top:H-118,width:CW,height:1.5,fill:t.line,name:'Footer rule'});
    T(t.foot,{left:M,top:H-92,width:CW,fontSize:24,fill:t.body,name:'Footer'});
  }

  canvas.discardActiveObject(); canvas.requestRenderAll(); renderLayers(); snapshot(); toast(t.name+' applied');
}

/* ═════════ ADDERS ═════════ */
function center(o){o.set({left:baseW/2,top:baseH/2,originX:'center',originY:'center'})}
function addText(kind){
  const cfg={head:{t:'YOUR HEADLINE',size:150,w:'700',f:'Sora'},sub:{t:'Subheading goes here',size:64,w:'600',f:'Inter'},body:{t:'Body copy — describe your event, product or story in a couple of concise lines.',size:34,w:'400',f:'Inter'}}[kind];
  const o=new fabric.Textbox(cfg.t,{width:baseW*0.8,fontSize:cfg.size,fontFamily:cfg.f,fontWeight:cfg.w,fill:'#101d36',name:kind==='head'?'Headline':kind==='sub'?'Subheading':'Body Text',textAlign:'left'});
  center(o);canvas.add(o).setActiveObject(o);canvas.requestRenderAll();renderLayers();snapshot();
}
function applyFont(f){ const o=canvas.getActiveObject(); if(!o||!o.set||!('fontFamily' in o)){toast('Select a text layer');return}
  document.fonts.load(`16px "${f}"`).then(()=>{o.set('fontFamily',f);canvas.requestRenderAll();snapshot()}); }
function addShape(s){
  const S=Math.min(baseW,baseH)*0.35, C={fill:'#ff7a18'};
  let o;
  if(s==='rect')o=new fabric.Rect({width:S*1.4,height:S,rx:0,ry:0,...C,name:'Rectangle'});
  else if(s==='pill')o=new fabric.Rect({width:S*1.6,height:S*0.6,rx:S*0.3,ry:S*0.3,...C,name:'Pill'});
  else if(s==='circle')o=new fabric.Circle({radius:S/2,...C,name:'Circle'});
  else if(s==='ring')o=new fabric.Circle({radius:S/2,fill:'transparent',stroke:'#ff7a18',strokeWidth:S*0.10,name:'Ring'});
  else if(s==='triangle')o=new fabric.Triangle({width:S,height:S,...C,name:'Triangle'});
  else if(s==='ellipse')o=new fabric.Ellipse({rx:S*0.7,ry:S*0.42,...C,name:'Ellipse'});
  else if(s==='line')o=new fabric.Rect({width:S*1.8,height:10,fill:'#101d36',name:'Line'});
  else if(s==='diamond')o=new fabric.Rect({width:S*0.72,height:S*0.72,angle:45,...C,name:'Diamond'});
  else if(s==='cross')o=new fabric.Group([new fabric.Rect({left:-S*0.1,top:-S*0.4,width:S*0.2,height:S*0.8,fill:'#ff7a18'}),new fabric.Rect({left:-S*0.4,top:-S*0.1,width:S*0.8,height:S*0.2,fill:'#ff7a18'})],{name:'Cross'});
  else if(s==='arrow')o=new fabric.Group([new fabric.Rect({left:-S*0.5,top:-S*0.05,width:S*0.8,height:S*0.1,fill:'#101d36'}),new fabric.Triangle({left:S*0.3,top:-S*0.16,width:S*0.32,height:S*0.32,angle:90,fill:'#101d36'})],{name:'Arrow'});
  else if(s==='star'){ const pts=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2?S*0.22:S*0.5;pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r})} o=new fabric.Polygon(pts,{...C,name:'Star'}); }
  else { const pts=[];for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;pts.push({x:Math.cos(a)*S*0.5,y:Math.sin(a)*S*0.5})} o=new fabric.Polygon(pts,{...C,name:'Hexagon'}); }
  center(o);canvas.add(o).setActiveObject(o);canvas.requestRenderAll();renderLayers();snapshot();
}

let uploads=[];
function paintUploads(){ const g=$('#uploadGrid'); if(!g)return;
  g.innerHTML=uploads.map((u,i)=>`<button data-up="${i}" class="tr aspect-square overflow-hidden rounded-lg border border-navy-100 hover:-translate-y-0.5 hover:border-flame-500"><img src="${u}" class="h-full w-full object-cover"></button>`).join('')||`<p class="col-span-3 text-[11px] text-navy-500/60">No uploads yet.</p>`; }
function readFiles(files){ [...files].filter(f=>f.type.startsWith('image')).forEach(f=>{ const r=new FileReader();
  r.onload=()=>{uploads.unshift(r.result);paintUploads();placeImage(r.result)};r.readAsDataURL(f)}); }
$('#fileInput').onchange=e=>readFiles(e.target.files);
function placeImage(src){ fabric.Image.fromURL(src,img=>{ const s=Math.min(baseW*0.7/img.width,baseH*0.7/img.height);
  img.set({scaleX:s,scaleY:s,name:'Image'}); center(img); canvas.add(img).setActiveObject(img); canvas.requestRenderAll(); renderLayers(); snapshot(); },{crossOrigin:'anonymous'}); }
function wireUploads(){ const dz=$('#dropzone'); if(!dz)return;
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drop-active')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drop-active')}));

  const shadow=()=>{o.set('shadow',new fabric.Shadow({offsetX:+$('#pSX').value,offsetY:+$('#pSY').value,blur:+$('#pSB').value,color:$('#pSC').value}));canvas.requestRenderAll()};

  on('#pFS','input',live(v=>o.set('fontSize',+v))); on('#pFW','change',live(v=>o.set('fontWeight',v)));

  on('#aFront','click',()=>{canvas.bringToFront(o);done()}); on('#aBack','click',()=>{canvas.sendToBack(o);done()});
  on('#aFwd','click',()=>{canvas.bringForward(o);done()}); on('#aBwd','click',()=>{canvas.sendBackwards(o);done()});
  ['#pX','#pY','#pW','#pH','#pRot','#pSkX','#pSkY','#pOp','#pFill','#pRx','#pStroke','#pSW','#pDash','#pFS','#pLS','#pLH','#pSX','#pSY','#pSB','#pSC']
    .forEach(i=>on(i,'change',done));
}

/* AI background remove — luminance/edge-seeded flood removal */
$('#btnAiBg').onclick=()=>{
  const o=canvas.getActiveObject(); if(!o||o.type!=='image'){toast('Select an image');return}
  const btn=$('#btnAiBg'); btn.innerHTML='<span class="spin inline-block">◌</span> Processing…';
  setTimeout(()=>{
    try{
      const el=o._element, w=el.naturalWidth||el.width, h=el.naturalHeight||el.height;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.drawImage(el,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h), p=d.data;
      // sample the 4 corners as background references
      const refs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const i=(y*w+x)*4;return [p[i],p[i+1],p[i+2]]});
      const tol=68;
      for(let i=0;i<p.length;i+=4){
        for(const r of refs){
          const dist=Math.sqrt((p[i]-r[0])**2+(p[i+1]-r[1])**2+(p[i+2]-r[2])**2);
          if(dist<tol){ p[i+3]=Math.max(0,Math.round(p[i+3]*(dist/tol)**2)); break; }
        }
      }
      ctx.putImageData(d,0,0);
      fabric.Image.fromURL(cv.toDataURL('image/png'),img=>{
        img.set({left:o.left,top:o.top,angle:o.angle,scaleX:o.scaleX,scaleY:o.scaleY,originX:o.originX,originY:o.originY,name:(o.name||'Image')+' · cutout'});
        canvas.remove(o); canvas.add(img).setActiveObject(img); canvas.requestRenderAll(); renderLayers(); snapshot(); toast('Background removed');
        btn.innerHTML='✦ AI Remove BG';
      });
    }catch(err){ toast('Cannot process cross-origin image'); btn.innerHTML='✦ AI Remove BG'; }
  },60);
};

function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
function dpiMult(){ const dpi=+($('#expDpi')?.value||150); return Math.max(1,Math.min(8,dpi/72)); }
function doExport(kind){
  const z=zoom; canvas.discardActiveObject(); canvas.setZoom(1); canvas.setDimensions({width:baseW,height:baseH}); canvas.renderAll();
  const restoreZ=()=>{setZoom(z);canvas.renderAll()};
  const m=dpiMult();
  try{
    if(kind==='png'){download(canvas.toDataURL({format:'png',multiplier:m}),`aurora-poster@${Math.round(m*100)/100}x.png`);toast('PNG exported at '+$('#expDpi').value+' DPI')}
    else if(kind==='jpg'){const bg=canvas.backgroundColor;if(!bg)canvas.backgroundColor='#fff';
      download(canvas.toDataURL({format:'jpeg',quality:.92,multiplier:m}),'aurora-poster.jpg');canvas.backgroundColor=bg;toast('JPG exported')}
    else if(kind==='webp'){const bg=canvas.backgroundColor;if(!bg)canvas.backgroundColor='#fff';
      download(canvas.toDataURL({format:'webp',quality:.92,multiplier:m}),'aurora-poster.webp');canvas.backgroundColor=bg;toast('WEBP exported')}
    else if(kind==='svg'){const blob=new Blob([canvas.toSVG()],{type:'image/svg+xml'});download(URL.createObjectURL(blob),'aurora-poster.svg');toast('SVG exported')}
    else if(kind==='json'){const blob=new Blob([JSON.stringify(projectJSON(),null,2)],{type:'application/json'});download(URL.createObjectURL(blob),'aurora-project.json');toast('Project exported')}
    else if(kind==='pdf'){
      const data=canvas.toDataURL({format:'png',multiplier:m});
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:baseW>baseH?'landscape':'portrait',unit:'px',format:[baseW,baseH]});
      pdf.addImage(data,'PNG',0,0,baseW,baseH); pdf.save('aurora-poster.pdf'); toast('PDF exported');
    }
    else if(kind==='bleed'){
      const bl=Math.max(0,+($('#expBleed')?.value||36));
      const data=canvas.toDataURL({format:'png',multiplier:m});
      const {jsPDF}=window.jspdf; const W=baseW+bl*2,H=baseH+bl*2;
      const pdf=new jsPDF({orientation:W>H?'landscape':'portrait',unit:'px',format:[W,H]});
      pdf.setFillColor(255,255,255); pdf.rect(0,0,W,H,'F');
      pdf.addImage(data,'PNG',bl,bl,baseW,baseH);
      pdf.setDrawColor(0); pdf.setLineWidth(.6);
      const mk=bl*0.7;
      [[bl,bl,-1,-1],[bl+baseW,bl,1,-1],[bl,bl+baseH,-1,1],[bl+baseW,bl+baseH,1,1]].forEach(([x,y,sx,sy])=>{
        pdf.line(x,y+sy*4,x,y+sy*mk); pdf.line(x+sx*4,y,x+sx*mk,y);
      });
      pdf.setFontSize(7); pdf.text(`AURORA.STUDIO · ${baseW}×${baseH}px · ${$('#expDpi').value} DPI · ${bl}px bleed`,6,10);
      pdf.save('aurora-print-ready.pdf'); toast('Print-ready PDF with bleed marks');
    }
    else if(kind==='allpdf'){ restoreZ(); exportAllPages(m); return; }
  }catch(err){toast('Export failed: '+err.message)}
  restoreZ();
}
async function exportAllPages(m){
  commitPage();
  const {jsPDF}=window.jspdf; let pdf=null;
  for(const p of pages){
    const data=await renderPageDataURL(p,m);
    const o=p.w>p.h?'landscape':'portrait';
    if(!pdf) pdf=new jsPDF({orientation:o,unit:'px',format:[p.w,p.h]});
    else pdf.addPage([p.w,p.h],o);
    pdf.addImage(data,'PNG',0,0,p.w,p.h);
  }
  pdf.save('aurora-multipage.pdf'); toast(pages.length+' pages exported to PDF');
}
function renderPageDataURL(p,m){
  return new Promise(res=>{
    const el=document.createElement('canvas');
    const tmp=new fabric.StaticCanvas(el,{width:p.w,height:p.h});
    tmp.loadFromJSON(p.json,()=>{ tmp.renderAll(); const d=tmp.toDataURL({format:'png',multiplier:m||1}); tmp.dispose(); res(d); });
  });
}

  }
});

<!-- ════════════════════════════════════════════════════════════════════
     AURORA FEATURE PACK v3
     4 modules bolted onto the existing engine (canvas / snapshot /
     renderLayers / toast / panels are shared globals):
       A. Smart tools     — align, distribute, group, lock, clipboard, nudge
       B. Text & effects  — curve, gradient fill, stroke presets, patterns
       C. Assets & AI     — stock search, QR, charts, palette generator
       D. Collaboration   — history timeline, comment pins, share link, brand kit
     ════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
const sel = ()=>canvas.getActiveObject();
const many = o => o && o.type==='activeSelection';
const need = ()=>{ const o=sel(); if(!o){toast('Select an object first');return null} return o; };
const done = ()=>{ canvas.requestRenderAll(); renderLayers(); snapshot(); };

/* ══════════════ A. SMART TOOLS ══════════════ */

/* Alignment — to the active multi-selection when 2+ objects, else the artboard */
function align(dir){
  const o=need(); if(!o)return;
  if(many(o)){
    const w=o.width, h=o.height;
    o.forEachObject(c=>{
      const b=c.getBoundingRect(true,true), ow=b.width, oh=b.height;
      if(dir==='l') c.left=-w/2+ow/2*(c.originX==='center'?1:0)+(c.originX==='center'?0:0)-(c.originX==='center'?0:0), c.set({originX:'center',left:-w/2+ow/2});
      if(dir==='r') c.set({originX:'center',left:w/2-ow/2});
      if(dir==='cx')c.set({originX:'center',left:0});
      if(dir==='t') c.set({originY:'center',top:-h/2+oh/2});
      if(dir==='b') c.set({originY:'center',top:h/2-oh/2});
      if(dir==='cy')c.set({originY:'center',top:0});
      c.setCoords();
    });
  } else {
    const b=o.getBoundingRect(true,true);
    const cx=o.left-(b.left+b.width/2), cy=o.top-(b.top+b.height/2);
    if(dir==='l') o.left = 0 + b.width/2 + cx;
    if(dir==='r') o.left = baseW - b.width/2 + cx;
    if(dir==='cx')o.left = baseW/2 + cx;
    if(dir==='t') o.top  = 0 + b.height/2 + cy;
    if(dir==='b') o.top  = baseH - b.height/2 + cy;
    if(dir==='cy')o.top  = baseH/2 + cy;
    o.setCoords();
  }
  done();
}

/* Distribute evenly across the selection bounds */
function distribute(axis){
  const o=sel();
  if(!many(o)||o._objects.length<3) return toast('Select 3+ objects');
  const items=o._objects.slice().sort((a,b)=> axis==='x' ? a.left-b.left : a.top-b.top);
  const first=items[0], last=items[items.length-1];
  const span=(axis==='x'?last.left-first.left:last.top-first.top)/(items.length-1);
  items.forEach((c,i)=>{ if(axis==='x') c.left=first.left+span*i; else c.top=first.top+span*i; c.setCoords(); });
  done();
}

function groupSel(){
  const o=sel(); if(!o)return toast('Select objects');
  if(many(o)){ const g=o.toGroup(); g.name='Group'; toast('Grouped'); }
  else if(o.type==='group'){ o.toActiveSelection(); toast('Ungrouped'); }
  else return toast('Select 2+ objects to group');
  done();
}
function toggleLock(){
  const o=need(); if(!o)return;
  const l=!o.lockMovementX;
  o.set({lockMovementX:l,lockMovementY:l,lockRotation:l,lockScalingX:l,lockScalingY:l,hasControls:!l});
  toast(l?'Layer locked':'Layer unlocked'); done();
}
function toggleHide(){
  const o=need(); if(!o)return;
  o.set({opacity:o.opacity===0?1:0, hidden:o.opacity!==0});
  toast(o.opacity===0?'Layer hidden':'Layer shown'); done();
}
function flip(ax){ const o=need(); if(!o)return; o.set(ax==='x'?'flipX':'flipY', !(ax==='x'?o.flipX:o.flipY)); done(); }

/* Clipboard + duplicate */
let clip=null;
function copySel(){ const o=need(); if(!o)return; o.clone(c=>{clip=c; toast('Copied')}); }
function pasteClip(off){
  if(!clip) return toast('Clipboard empty');
  clip.clone(c=>{
    c.set({left:(clip.left||0)+(off||24),top:(clip.top||0)+(off||24),evented:true});
    if(c.type==='activeSelection'){ c.canvas=canvas; c.forEachObject(o=>canvas.add(o)); c.setCoords(); }
    else canvas.add(c);
    canvas.setActiveObject(c); done();
  });
}
function duplicateSel(){ const o=need(); if(!o)return; o.clone(c=>{ c.set({left:o.left+28,top:o.top+28}); canvas.add(c); canvas.setActiveObject(c); done(); }); }

/* Floating smart-tools bar, injected next to the view tools */
(function smartBar(){
  const bar=document.createElement('div');
  bar.className='glass absolute left-4 top-20 z-30 flex flex-wrap items-center gap-1 rounded-xl p-1 text-navy-700';
  bar.style.maxWidth='330px';
  const B=(t,tt,act)=>`<button data-sm="${act}" class="dock-btn tr rounded-lg px-2 py-1 text-[11px] font-semibold hover:!text-navy-900" title="${tt}">${t}</button>`;
  bar.innerHTML =
    B('⯇','Align left','al-l')+B('≡','Align center X','al-cx')+B('⯈','Align right','al-r')+
    B('⤒','Align top','al-t')+B('⦿','Align center Y','al-cy')+B('⤓','Align bottom','al-b')+
    '<span class="mx-0.5 h-5 w-px bg-navy-200"></span>'+
    B('⇹','Distribute horizontally','dx')+B('⇳','Distribute vertically','dy')+
    '<span class="mx-0.5 h-5 w-px bg-navy-200"></span>'+
    B('⛶','Group / Ungroup (Ctrl+G)','grp')+B('🔒','Lock / Unlock','lock')+B('👁','Hide / Show','hide')+

      fx:()=>flip('x'),fy:()=>flip('y'),dup:duplicateSel})[a]();

/* Keyboard shortcuts — skipped while typing in a field or on canvas text */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  const o=sel(); if(o&&o.isEditing)return;
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod&&k==='c'){e.preventDefault();copySel()}
  else if(mod&&k==='v'){e.preventDefault();pasteClip()}
  else if(mod&&k==='a'){e.preventDefault();canvas.discardActiveObject();
    const s=new fabric.ActiveSelection(canvas.getObjects().filter(x=>x.selectable!==false),{canvas});
    canvas.setActiveObject(s);canvas.requestRenderAll()}
});

/* ══════════════ B. TEXT & EFFECTS ══════════════ */

const isText = o => o && /text/.test(o.type);

/* Curved text — fabric text-on-path with a generated arc */
function curveText(amount){
  const o=sel(); if(!isText(o))return toast('Select a text layer');
  if(!amount){ o.set('path',null); canvas.requestRenderAll(); snapshot(); return toast('Curve removed'); }
  const w=(o.width||400)*(o.scaleX||1), r=Math.max(80, (w*w)/(8*Math.abs(amount)) + Math.abs(amount)/2);
  const sweepUp=amount>0;
  const d=`M 0 0 A ${r} ${r} 0 0 ${sweepUp?1:0} ${w} 0`;
  const p=new fabric.Path(d,{fill:'',stroke:'',objectCaching:false});
  o.set({path:p,pathAlign:'baseline',textAlign:'center'});
  canvas.requestRenderAll(); snapshot();
}

/* Gradient fill for any selected object (text included) */
function gradientFill(a,b,angle){
  const o=need(); if(!o)return;
  const w=o.width||100,h=o.height||100, rad=(angle||135)*Math.PI/180;
  const dx=Math.cos(rad)*w/2, dy=Math.sin(rad)*h/2;
  o.set('fill', new fabric.Gradient({type:'linear',
    coords:{x1:w/2-dx,y1:h/2-dy,x2:w/2+dx,y2:h/2+dy},
    colorStops:[{offset:0,color:a},{offset:1,color:b}]}));
  done();
}

/* Outline / stroke presets */
const STROKES={
  none:{stroke:null,strokeWidth:0},
  hairline:{stroke:'#101d36',strokeWidth:1,paintFirst:'stroke'},
  bold:{stroke:'#101d36',strokeWidth:6,paintFirst:'stroke'},
  flame:{stroke:'#ff7a18',strokeWidth:4,paintFirst:'stroke'},
  ghost:{fill:'transparent',stroke:'#101d36',strokeWidth:3,paintFirst:'stroke'},
  neon:{stroke:'#7dd3fc',strokeWidth:3,paintFirst:'stroke'}
};
function applyStroke(k){ const o=need(); if(!o)return; o.set(STROKES[k]); done(); }

/* Procedural pattern / noise backdrops */
function patternBg(kind){
  const t=document.createElement('canvas'), s=t.width=t.height=kind==='noise'?120:40, x=t.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,s,s);
  if(kind==='dots'){ x.fillStyle='rgba(16,29,54,.22)'; x.beginPath(); x.arc(s/2,s/2,3,0,7); x.fill(); }
  if(kind==='lines'){ x.strokeStyle='rgba(16,29,54,.18)'; x.lineWidth=3; x.beginPath(); x.moveTo(0,s); x.lineTo(s,0); x.stroke(); }
  if(kind==='cross'){ x.strokeStyle='rgba(255,122,24,.35)'; x.lineWidth=2; x.beginPath(); x.moveTo(s/2,0);x.lineTo(s/2,s);x.moveTo(0,s/2);x.lineTo(s,s/2); x.stroke(); }
  if(kind==='noise'){ const d=x.createImageData(s,s);
    for(let i=0;i<d.data.length;i+=4){const v=225+Math.random()*30;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
    x.putImageData(d,0,0); }
  const r=new fabric.Rect({left:0,top:0,width:baseW,height:baseH,name:'Pattern Backdrop',selectable:true,
    fill:new fabric.Pattern({source:t,repeat:'repeat'})});
  canvas.add(r); canvas.sendToBack(r); done(); toast('Pattern applied');
}

function stockURL(q,i){ return `https://picsum.photos/seed/${encodeURIComponent(q+'-'+i)}/900/1200`; }

function addQR(data){
  if(!data) return toast('Enter a link or text');
  placeImage('https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=1&data='+encodeURIComponent(data));
  toast('QR code added');
}

/* Vector bar / donut chart built from comma-separated values */
function addChart(kind,values,color){
  const v=values.split(',').map(n=>parseFloat(n)).filter(n=>!isNaN(n));
  if(v.length<2) return toast('Enter 2+ numbers');
  const max=Math.max(...v), W=Math.min(baseW,baseH)*0.6, H=W*0.62, parts=[];
  if(kind==='bar'){
    const gap=W*0.04, bw=(W-gap*(v.length-1))/v.length;
    v.forEach((n,i)=>{ const h=Math.max(6,H*(n/max));
      parts.push(new fabric.Rect({left:i*(bw+gap),top:H-h,width:bw,height:h,fill:color,rx:6,ry:6})); });
  } else {
    const total=v.reduce((a,b)=>a+b,0); let ang=-Math.PI/2, R=H/2;
    v.forEach((n,i)=>{ const a2=ang+(n/total)*Math.PI*2;
      const p=`M ${R} ${R} L ${R+R*Math.cos(ang)} ${R+R*Math.sin(ang)} A ${R} ${R} 0 ${(a2-ang)>Math.PI?1:0} 1 ${R+R*Math.cos(a2)} ${R+R*Math.sin(a2)} Z`;
      parts.push(new fabric.Path(p,{fill:color,opacity:1-i*0.13})); ang=a2; });
  }
  const g=new fabric.Group(parts,{name:kind==='bar'?'Bar Chart':'Pie Chart'});
  center(g); canvas.add(g).setActiveObject(g); done(); toast('Chart added');
}

/* Palette generator — harmonious HSL sets, seeded from the current accent */
let palette=[];
function genPalette(){
  const h=Math.floor(Math.random()*360), mode=Math.floor(Math.random()*3);
  const shift=[30,150,180][mode];
  palette=[
    `hsl(${h},68%,18%)`,`hsl(${h},62%,34%)`,
    `hsl(${(h+shift)%360},88%,55%)`,`hsl(${(h+shift)%360},92%,72%)`,
    `hsl(${h},30%,96%)`
  ].map(hslHex);
  renderPanel();
}
function hslHex(s){
  const [h,sa,l]=s.match(/[\d.]+/g).map(Number), a=sa/100*Math.min(l/100,1-l/100);
  const f=n=>{const k=(n+h/30)%12, c=l/100-a*Math.max(-1,Math.min(k-3,9-k,1));
    return Math.round(255*c).toString(16).padStart(2,'0')};
  return '#'+f(0)+f(8)+f(4);
}
function autoLayout(){
  const objs=canvas.getObjects().filter(o=>o.selectable!==false);
  if(!objs.length) return toast('Nothing to arrange');
  const M=baseW*0.08; let y=M;
  objs.forEach(o=>{ const b=o.getBoundingRect(true,true);
    o.set({originX:'center',originY:'top',left:baseW/2,top:y}); o.setCoords(); y+=b.height+M*0.5; });
  done(); toast('Auto-layout applied');
}

/* Read-only share link — project state encoded in the URL hash */
function shareLink(){
  try{
    const json=projectJSON();
    const enc=btoa(unescape(encodeURIComponent(typeof json==='string'?json:JSON.stringify(json))));
    const url=location.origin+location.pathname+'#view='+enc;
    if(url.length>60000) return toast('Design too large for a link — save it instead');
    navigator.clipboard?.writeText(url).then(()=>toast('Read-only link copied'),()=>prompt('Copy link',url));
  }catch(err){ toast('Could not build link'); }
}
function readOnlyBoot(){
  const m=location.hash.match(/#view=(.+)$/); if(!m)return;
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    openProject(data);
    document.body.classList.add('viewonly');
    ['leftPanel','rightPanel'].forEach(id=>document.getElementById(id)?.classList.add('collapsed'));
    canvas.forEachObject(o=>o.set({selectable:false,evented:false}));
    canvas.selection=false; canvas.requestRenderAll();
    toast('Read-only preview');
  }catch(e){ toast('Shared link unreadable'); }
}

$('#panelBody').addEventListener('click',e=>{

  /* effects */
  if(d.fx==='curve-reset')return curveText(0);

  /* collaboration */

  if(d.cb==='pin'){ pinMode=!pinMode; canvas.selection=!pinMode; renderPanel(); return; }
  if(d.cb==='share') return shareLink();
  if(d.cdel!==undefined){ comments.splice(+d.cdel,1); saveComments(); renderPins(); return renderPanel(); }
  if(d.cb==='addcolor'){ const c=$('#bkColor').value;
    if(!brand.colors.includes(c))brand.colors.push(c); saveBrand(); renderPanel(); return toast('Color saved'); }
  if(d.cb==='addfont'){ const o=sel();
    if(!isText(o))return toast('Select a text layer');
    if(!brand.fonts.includes(o.fontFamily))brand.fonts.push(o.fontFamily); saveBrand(); renderPanel(); return toast('Font saved'); }
  if(d.cb==='addlogo'){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
      r.onload=()=>{ brand.logos.push(r.result); saveBrand(); renderPanel(); toast('Logo saved'); }; r.readAsDataURL(f); };
    inp.click(); return;
  }
  if(d.bc){ const o=sel(); if(o){o.set('fill',d.bc);done()}else{canvas.backgroundColor=d.bc;canvas.requestRenderAll();snapshot()} return; }
  if(d.bf) return applyFont(d.bf);
  if(d.bl!==undefined) return placeImage(brand.logos[+d.bl]);
});

/* Live curve slider */
$('#panelBody').addEventListener('input',e=>{ if(e.target.id==='fxCurve') curveText(+e.target.value); });

/* Keep the history timeline and pins in sync */
canvas.on('object:modified',()=>{ if(tab==='collab')renderPanel(); });
renderPins();
readOnlyBoot();
})();
</script>
<script src="assets/aurora-responsive.js"></script>
</body>
