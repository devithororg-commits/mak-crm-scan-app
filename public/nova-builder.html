<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOVA Builder — AURORA.STUDIO</title>
<meta name="description" content="NOVA Builder — drag-and-drop presentation studio by AURORA.STUDIO. Provided by Devithor.org." />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
tailwind.config = { theme: { extend: {
  colors:{
    ink:{900:'#05070f',800:'#080c18',700:'#0d1324',600:'#131b32',500:'#1b2542',400:'#28345a'},
    mist:{100:'#e8edf9',200:'#c3cde6',300:'#93a1c4',400:'#6b7aa1'},
    volt:{300:'#7ff3e4',400:'#35e2c8',500:'#0fd3b6',600:'#06a892'},
    gold:{300:'#ffdf95',400:'#f5c452',500:'#e0a92c'},
    rose:{300:'#ffb4c8',400:'#ff6b9d',500:'#e8437a'},
    indigo:{300:'#a5b4fc',400:'#818cf8',500:'#6366f1'}
  },
  fontFamily:{ sans:['Inter','system-ui','sans-serif'], sora:['Sora','sans-serif'], space:['Space Grotesk','sans-serif'] }
}}}
</script>
<style>
  :root{--nova-accent:#35e2c8;--nova-accent-soft:#7ff3e4;--nova-radius:1.25rem;--nova-font:'Inter',system-ui,sans-serif}
  body{background:#05070f;color:#e8edf9;font-family:var(--nova-font);overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(760px 520px at 8% 4%, rgba(15,211,182,.13), transparent 62%),
               radial-gradient(760px 560px at 94% 96%, rgba(245,196,82,.10), transparent 62%)}
  .glass{background:rgba(13,19,36,.66);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.08);box-shadow:0 22px 60px -28px rgba(0,0,0,.9)}
  .glass-soft{background:rgba(19,27,50,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07)}
  .tr{transition:all .24s cubic-bezier(.22,1,.36,1)}
  *{scrollbar-width:thin;scrollbar-color:rgba(147,161,196,.28) transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(147,161,196,.22);border-radius:99px}
  .wcard{cursor:grab;transition:transform .22s,box-shadow .22s,border-color .22s}
  .wcard:hover{transform:translateY(-3px);border-color:rgba(53,226,200,.5);box-shadow:0 18px 40px -22px rgba(15,211,182,.85)}
  .wcard:active{cursor:grabbing}
  .sortable-ghost{opacity:.35;filter:grayscale(.4)}
  .sortable-drag{transform:rotate(1.2deg);box-shadow:0 30px 70px -24px rgba(0,0,0,.95)}
  .block{position:relative;border:1px solid transparent;border-radius:var(--nova-radius);transition:border-color .2s,box-shadow .2s,opacity .6s,transform .6s}
  .block.hidden-block{opacity:.35;filter:grayscale(.5)}
  .block:hover{border-color:rgba(53,226,200,.35)}
  .block.sel{border-color:rgba(53,226,200,.85);box-shadow:0 0 0 1px rgba(53,226,200,.35),0 0 46px -14px rgba(15,211,182,.8)}
  .block .tools{opacity:0;transform:translateY(-6px);transition:.2s cubic-bezier(.22,1,.36,1)}
  .block:hover .tools,.block.sel .tools{opacity:1;transform:none}
  .handle{cursor:grab}.handle:active{cursor:grabbing}
  .drop-hint{transition:opacity .25s}
  .col-star{background:linear-gradient(180deg,rgba(15,211,182,.16),rgba(15,211,182,.05));box-shadow:inset 1px 0 0 rgba(53,226,200,.45),inset -1px 0 0 rgba(53,226,200,.45)}
  .col-star-gold{background:linear-gradient(180deg,rgba(245,196,82,.18),rgba(245,196,82,.05));box-shadow:inset 1px 0 0 rgba(245,196,82,.5),inset -1px 0 0 rgba(245,196,82,.5)}
  .col-star-rose{background:linear-gradient(180deg,rgba(255,107,157,.18),rgba(255,107,157,.05));box-shadow:inset 1px 0 0 rgba(255,107,157,.5),inset -1px 0 0 rgba(255,107,157,.5)}
  .col-star-indigo{background:linear-gradient(180deg,rgba(129,140,248,.18),rgba(129,140,248,.05));box-shadow:inset 1px 0 0 rgba(129,140,248,.5),inset -1px 0 0 rgba(129,140,248,.5)}
  .fld{width:100%;border-radius:.65rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:7px 10px;font-size:12px;color:#e8edf9}
  .fld:focus{outline:none;border-color:rgba(53,226,200,.7);box-shadow:0 0 0 3px rgba(15,211,182,.15)}
  .panel-in{animation:fu .3s cubic-bezier(.22,1,.36,1)}
  @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes revealUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .reveal-ready{opacity:0;transform:translateY(28px)}
  .reveal-in{animation:revealUp .7s cubic-bezier(.22,1,.36,1) forwards}
  body.preview #libPanel,body.preview #inspPanel,body.preview .tools,body.preview #slideStrip,body.preview .top-tools{display:none!important}
  body.preview .block{border-color:transparent!important;box-shadow:none!important}
  body.preview #canvasWrap{padding:0}
  body.present{overflow:hidden}
  body.present #libPanel,body.present #inspPanel,body.present header,body.present #slideStrip,body.present .top-tools{display:none!important}
  body.present #canvasWrap{position:fixed;inset:0;z-index:100;border-radius:0;overflow:hidden}
  body.present #canvasInner{max-width:none!important;width:100%!important;height:100vh;padding:0!important}
  body.present #canvas{min-height:100vh;padding:2rem}
  body.present .block .tools{display:none!important}
  body.grid-on #canvasInner{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px}
  .tab-btn.active{background:rgba(53,226,200,.15);color:#7ff3e4;border-color:rgba(53,226,200,.35)}
  .dev-btn.active{background:rgba(53,226,200,.2);color:#7ff3e4;border-color:rgba(53,226,200,.5)}
  .slide-tab.active{background:rgba(53,226,200,.18);border-color:rgba(53,226,200,.5);color:#7ff3e4}
  .layer-row.active{background:rgba(53,226,200,.12);border-color:rgba(53,226,200,.35)}
  [contenteditable]:focus{outline:2px dashed rgba(53,226,200,.55);outline-offset:3px;border-radius:6px}
  .export-menu{opacity:0;visibility:hidden;transform:translateY(-6px);transition:.2s}
  .export-wrap:focus-within .export-menu,.export-wrap:hover .export-menu{opacity:1;visibility:visible;transform:none}
  .faq-panel{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .faq-item.open .faq-panel{max-height:400px}
  .faq-item.open .faq-chev{transform:rotate(180deg)}
  #aiModal.hidden{display:none}
  .collab-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:4px 10px;font-size:11px;font-weight:600;color:#93a1c4}
  .collab-dot{width:7px;height:7px;border-radius:50%;background:#6b7aa1;box-shadow:0 0 0 2px rgba(107,122,161,.25)}
  .collab-dot.online{background:#35e2c8;box-shadow:0 0 8px rgba(53,226,200,.6)}
  .version-row{display:flex;align-items:center;gap:8px;border-radius:.75rem;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:8px 10px;font-size:11px}
  .version-row:hover{border-color:rgba(53,226,200,.35)}
  .import-panel textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:11px}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.15);border-top-color:#35e2c8;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cms-bound::after{content:'🔗';margin-left:4px;font-size:10px}
  #canvasWrap{display:flex;flex-direction:column;min-height:0;background:radial-gradient(ellipse at 50% 0%,rgba(15,211,182,.06),transparent 55%)}
  #deviceViewport{position:relative;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:1rem 1rem 2rem;scroll-behavior:smooth}
  #deviceMeta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-bottom:.75rem;transition:opacity .3s}
  #deviceMeta.hidden-meta{opacity:0;height:0;margin:0;overflow:hidden;pointer-events:none}
  .device-pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);padding:.35rem .75rem;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#93a1c4}
  .device-pill strong{color:#7ff3e4;font-weight:800}
  #deviceScaler{transform-origin:top center;transition:transform .35s cubic-bezier(.22,1,.36,1);will-change:transform;width:100%;display:flex;justify-content:center}
  #deviceFrame{width:100%;transition:width .35s cubic-bezier(.22,1,.36,1),box-shadow .35s,border-radius .35s,border-color .35s}
  #deviceFrame.is-sim{border-radius:1.35rem;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 40px 90px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);background:#080c18;overflow:hidden}
  #deviceFrame.is-sim::before{content:"";display:block;height:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent);border-bottom:1px solid rgba(255,255,255,.06)}
  #deviceFrame.is-mobile::after{content:"";position:absolute;bottom:8px;left:50%;width:96px;height:4px;transform:translateX(-50%);border-radius:99px;background:rgba(255,255,255,.18);pointer-events:none}
  #deviceFrame.is-mobile{position:relative;border-radius:2rem;padding-bottom:18px}
  #deviceFrame.is-tablet{border-radius:1.5rem}
  #canvasInner{margin:0 auto;width:100%;transition:max-width .35s cubic-bezier(.22,1,.36,1),padding .35s;container-type:inline-size;container-name:nova-canvas}
  #canvasInner.dev-mobile,#canvasInner.dev-tablet{padding-left:.75rem;padding-right:.75rem}
  #canvasInner .nova-hero-grid{display:grid;gap:2rem;align-items:center}
  #canvasInner .nova-pricing-grid{display:grid;gap:1rem}
  #canvasInner .nova-stats-grid{display:grid;gap:.75rem;grid-template-columns:repeat(2,minmax(0,1fr))}
  #canvasInner .nova-testimonial-band{display:flex;flex-direction:column;gap:1.25rem}
  .nova-badge-grid{grid-template-columns:repeat(var(--nova-cols,4),minmax(0,1fr))}
  @container nova-canvas (min-width:900px){
    #canvasInner .nova-hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    #canvasInner .nova-pricing-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    #canvasInner .nova-stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    #canvasInner .nova-testimonial-band{flex-direction:row;align-items:center}
    #canvasInner .nova-badge-grid{grid-template-columns:repeat(var(--nova-cols,4),minmax(0,1fr))}
  }
  @container nova-canvas (min-width:560px) and (max-width:899px){
    #canvasInner .nova-hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    #canvasInner .nova-pricing-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    #canvasInner .nova-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    #canvasInner .nova-badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @container nova-canvas (max-width:559px){
    #canvasInner .nova-hero-grid{grid-template-columns:1fr!important}
    #canvasInner .nova-hero-img-right,#canvasInner .nova-hero-text-right{order:unset!important}
    #canvasInner .nova-pricing-grid{grid-template-columns:1fr!important}
    #canvasInner .nova-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    #canvasInner .nova-testimonial-band{flex-direction:column!important}
    #canvasInner .nova-badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    #canvasInner .nova-hero-title{font-size:1.65rem!important;line-height:1.12!important}
    #canvasInner .nova-hero-body{font-size:.82rem!important}
    #canvasInner .nova-section-title{font-size:1.15rem!important}
    #canvasInner .nova-stat-value{font-size:1.35rem!important}
    #canvasInner .nova-pricing-price{font-size:1.65rem!important;line-height:1.1!important}
    #canvasInner .nova-pricing-card{padding:1rem!important}
    #canvasInner .nova-cta-band{flex-direction:column!important;align-items:flex-start!important}
    #canvasInner .nova-cta-band a{width:100%;text-align:center}
    #canvasInner .nova-table-shell{overflow-x:auto;-webkit-overflow-scrolling:touch}
    #canvasInner .nova-table-shell table{min-width:520px;font-size:11px}
    #canvasInner .nova-table-shell th,#canvasInner .nova-table-shell td{padding:.55rem .45rem!important}
    #canvasInner section.glass{padding:1rem!important}
  }
  #canvasInner.dev-mobile .nova-hero-title{font-size:1.65rem!important;line-height:1.12!important}
  #canvasInner.dev-mobile .nova-hero-body{font-size:.82rem!important}
  #canvasInner.dev-mobile .nova-section-title{font-size:1.15rem!important}
  #canvasInner.dev-mobile .nova-stat-value{font-size:1.35rem!important}
  #canvasInner.dev-tablet .nova-hero-title{font-size:2rem!important}
  #canvasInner.dev-mobile .md\:grid-cols-2,#canvasInner.dev-mobile .md\:grid-cols-3,#canvasInner.dev-mobile .md\:grid-cols-4{grid-template-columns:repeat(1,minmax(0,1fr))!important}
  #canvasInner.dev-mobile .md\:flex-row{flex-direction:column!important}
  #canvasInner.dev-mobile .md\:order-1,#canvasInner.dev-mobile .md\:order-2{order:unset!important}
  #canvasInner.dev-mobile .nova-badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #canvasInner.dev-tablet .nova-badge-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #canvasInner.dev-tablet .md\:grid-cols-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #canvasInner.dev-tablet .md\:grid-cols-3{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #canvasInner.dev-mobile .nova-table-shell{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #canvasInner.dev-mobile .nova-table-shell table{min-width:520px;font-size:11px}
  #canvasInner.dev-mobile .nova-table-shell th,#canvasInner.dev-mobile .nova-table-shell td{padding:.55rem .45rem!important}
  #canvasInner.dev-mobile .nova-cta-band{flex-direction:column!important;align-items:flex-start!important}
  #canvasInner.dev-mobile .nova-cta-band a{width:100%;text-align:center}
  #canvasInner.dev-mobile .nova-pricing-card{text-align:left}
  #canvasInner.dev-mobile section.glass{padding:1rem!important}
  #canvasInner.dev-tablet section.glass{padding:1.25rem!important}
  body.preview #deviceMeta,body.preview #deviceFrame.is-sim::before{display:none}
  body.preview #deviceFrame.is-sim{border:none;box-shadow:none;background:transparent}
  body.preview #deviceScaler{transform:none!important}
  @media(max-width:1024px){#libPanel,#inspPanel{width:14rem}}
  @media(max-width:768px){
    body{overflow:auto}
    .relative.z-10.flex.h-screen{height:auto;min-height:100dvh}
    #libPanel,#inspPanel{position:fixed;z-index:90;top:4.5rem;bottom:.75rem;width:min(88vw,18rem);transform:translateX(-110%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    #inspPanel{right:.75rem;left:auto;transform:translateX(110%)}
    body.panel-left-open #libPanel{transform:none}
    body.panel-right-open #inspPanel{transform:none}
    #canvasWrap{min-height:60dvh}
  }
</style>
</head>
<body class="antialiased">
<div class="relative z-10 flex h-screen w-screen flex-col gap-3 p-3">
  <header class="glass top-tools flex shrink-0 flex-wrap items-center gap-2 rounded-2xl px-4 py-2.5">
    <div class="flex items-center gap-2.5">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-volt-400 to-volt-600 text-[15px] font-black text-ink-900">N</span>
      <div class="leading-tight">
        <p class="text-[13px] font-extrabold tracking-tight">NOVA<span class="text-volt-400">.</span>BUILDER</p>
        <p class="text-[9px] uppercase tracking-[.18em] text-mist-400">AURORA.STUDIO · Devithor.org</p>
      </div>
    </div>
    <span class="mx-1 h-7 w-px bg-white/10"></span>
    <div class="flex items-center gap-1">
      <button id="btnUndo" class="tr rounded-lg border border-white/10 px-2.5 py-1.5 text-[12px] text-mist-300 hover:border-volt-400/50" title="Undo (Ctrl+Z)">↶</button>
      <button id="btnRedo" class="tr rounded-lg border border-white/10 px-2.5 py-1.5 text-[12px] text-mist-300 hover:border-volt-400/50" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <span class="h-7 w-px bg-white/10"></span>
    <div id="deviceGroup" class="flex items-center gap-1">
      <button data-dev="desktop" class="dev-btn tr active rounded-lg border border-white/10 px-2.5 py-1.5 text-[11px] font-semibold">Desktop</button>
      <button data-dev="tablet" class="dev-btn tr rounded-lg border border-white/10 px-2.5 py-1.5 text-[11px] font-semibold">Tablet</button>
      <button data-dev="mobile" class="dev-btn tr rounded-lg border border-white/10 px-2.5 py-1.5 text-[11px] font-semibold">Mobile</button>
    </div>
    <span class="h-7 w-px bg-white/10"></span>
    <button id="btnGrid" class="tr rounded-lg border border-white/10 px-2.5 py-1.5 text-[11px] font-semibold text-mist-300">Grid</button>
    <span id="blockCount" class="rounded-lg bg-white/6 px-2.5 py-1.5 text-[11px] font-semibold text-mist-300">0 blocks</span>
    <div id="collabBadge" class="collab-badge hidden">
      <span id="collabDot" class="collab-dot"></span>
      <span id="collabStatus">Offline</span>
    </div>
    <button id="btnCloudQuick" class="tr rounded-lg border border-white/10 px-2.5 py-1.5 text-[12px] text-mist-300 hover:border-volt-400/50" title="Cloud save">☁</button>
    <div class="ml-auto flex flex-wrap items-center gap-2">
      <button id="btnClear" class="tr rounded-xl border border-white/10 px-3 py-2 text-[12px] font-semibold text-mist-300 hover:border-rose-400/50 hover:text-rose-300">Clear slide</button>
      <button id="btnSave" class="tr rounded-xl border border-white/10 px-3 py-2 text-[12px] font-semibold text-mist-300 hover:border-volt-400/60 hover:text-volt-300">Save</button>
      <button id="btnPreview" class="tr rounded-xl border border-white/10 px-3 py-2 text-[12px] font-semibold text-mist-200">Preview</button>
      <button id="btnPresent" class="tr rounded-xl border border-white/10 px-3 py-2 text-[12px] font-semibold text-mist-200">Present</button>
      <div class="export-wrap relative">
        <button id="btnExport" class="tr rounded-xl bg-gradient-to-r from-volt-400 to-volt-600 px-4 py-2 text-[12px] font-bold text-ink-900">Export ▾</button>
        <div class="export-menu glass absolute right-0 top-full z-50 mt-1 min-w-[160px] rounded-xl p-1">
          <button data-export="html" class="tr block w-full rounded-lg px-3 py-2 text-left text-[12px] hover:bg-white/8">HTML</button>
          <button data-export="json" class="tr block w-full rounded-lg px-3 py-2 text-left text-[12px] hover:bg-white/8">JSON layout</button>
          <button data-export="png" class="tr block w-full rounded-lg px-3 py-2 text-left text-[12px] hover:bg-white/8">PNG snapshot</button>
          <button data-export="pdf" class="tr block w-full rounded-lg px-3 py-2 text-left text-[12px] hover:bg-white/8">PDF deck</button>
          <button data-export="share" class="tr block w-full rounded-lg px-3 py-2 text-left text-[12px] hover:bg-white/8">Share state URL</button>
        </div>
      </div>
    </div>
  </header>
  <div class="flex min-h-0 flex-1 gap-3">
    <aside id="libPanel" class="glass flex w-64 shrink-0 flex-col rounded-2xl p-3">
      <div id="leftTabs" class="mb-2 flex flex-wrap gap-1">
        <button data-ltab="elements" class="tab-btn active tr rounded-lg border border-white/10 px-2 py-1 text-[10px] font-bold uppercase">Elements</button>
        <button data-ltab="templates" class="tab-btn tr rounded-lg border border-white/10 px-2 py-1 text-[10px] font-bold uppercase">Templates</button>
        <button data-ltab="layers" class="tab-btn tr rounded-lg border border-white/10 px-2 py-1 text-[10px] font-bold uppercase">Layers</button>
        <button data-ltab="import" class="tab-btn tr rounded-lg border border-white/10 px-2 py-1 text-[10px] font-bold uppercase">Import</button>
        <button data-ltab="collab" class="tab-btn tr rounded-lg border border-white/10 px-2 py-1 text-[10px] font-bold uppercase">Collab</button>
        <button data-ltab="ai" class="tab-btn tr rounded-lg border border-white/10 px-2 py-1 text-[10px] font-bold uppercase">AI</button>
      </div>
      <div id="leftPanel" class="min-h-0 flex-1 overflow-y-auto pr-1"></div>

function embedUrl(url){
  const u=String(url||'').trim();

function sanitizeHtml(html){
  const div=document.createElement('div');
  div.innerHTML=String(html||'');
  div.querySelectorAll('script,iframe,object,embed,form').forEach(el=>el.remove());
  return div.innerHTML;
}

function bindCms(obj){
  if(!state.cms?.data||!obj) return obj;
  const data=state.cms.data;
  const resolve=str=>{
    if(typeof str!=='string') return str;
    return str.replace(/\{\{([\w.]+)\}\}/g,(_,path)=>{
      let val=data;
      for(const p of path.split('.')) val=val?.[p];
      return val!=null?String(val):'';
    });
  };
  const walk=o=>{
    if(typeof o==='string') return resolve(o);
    if(Array.isArray(o)) return o.map(walk);
    if(o&&typeof o==='object'){ const r={}; for(const[k,v]of Object.entries(o)) r[k]=walk(v); return r; }
    return o;
  };
  return walk(structuredClone(obj));
}

function renderWidget(type,props){ return WIDGETS[type].render(bindCms(props)); }
function hasCmsBinding(props){ return /\{\{[\w.]+\}\}/.test(JSON.stringify(props||{})); }

function snapshot(){
  return JSON.stringify({pages:state.pages,currentPageId:state.currentPageId,theme:state.theme,seo:state.seo,cms:state.cms,deviceKey:state.deviceKey,device:state.device});
}
function pushHistory(){
  if(snapshotLock) return;
  undoStack.push(snapshot());
  if(undoStack.length>MAX_UNDO) undoStack.shift();
  redoStack=[];
  updateUndoButtons();
}
function restoreSnapshot(json){
  snapshotLock=true;
  try{
    const s=JSON.parse(json);
    state.pages=s.pages; state.currentPageId=s.currentPageId; state.theme={...state.theme,...s.theme}; state.seo=s.seo;
    if(s.cms) state.cms={...state.cms,...s.cms};
    if(s.deviceKey) state.deviceKey=s.deviceKey;
    if(s.device) state.device=s.device;
    ensureValidState();
    if(!state.pages.find(p=>p.id===state.currentPageId)) state.currentPageId=state.pages[0]?.id;
    selectedId=null; applyThemeCSS(); renderAll();
  }finally{ snapshotLock=false; }
}
function undo(){ if(!undoStack.length) return; redoStack.push(snapshot()); restoreSnapshot(undoStack.pop()); updateUndoButtons(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snapshot()); restoreSnapshot(redoStack.pop()); updateUndoButtons(); }
function updateUndoButtons(){ $('#btnUndo').disabled=!undoStack.length; $('#btnRedo').disabled=!redoStack.length; $('#btnUndo').style.opacity=undoStack.length?'1':'.4'; $('#btnRedo').style.opacity=redoStack.length?'1':'.4'; }

function commit(fn){ pushHistory(); fn(); persist(); renderAll(); }
function mutate(fn){ fn(); persist(); renderAll(); }

function mkBlock(type, props){

function persist(){ try{ localStorage.setItem(LS_V3, snapshot()); }catch(_){} broadcastState(); }
function migrateV2(data){
  const s=JSON.parse(data);
  if(!s.theme) s.theme={accent:'volt',font:'inter',radius:'md',animations:true,gsapEnabled:true};
  if(!s.theme.gsapEnabled) s.theme.gsapEnabled=true;
  if(!s.cms) s.cms={inline:'',url:'',refreshInterval:0,data:{}};
  if(!s.pages?.length) s.pages=[{id:uid('p'),name:'Slide 1',blocks:[]}];
  s.pages.forEach(pg=>pg.blocks.forEach(ensureBlockAnim));
  return JSON.stringify(s);
}
function restore(){
  try{
    const hash=location.hash.slice(1);
    const stateMatch=hash.match(/(?:^|&)state=([^&]+)/);
    if(stateMatch){ restoreSnapshot(decodeURIComponent(escape(atob(stateMatch[1])))); undoStack=[]; redoStack=[]; updateUndoButtons(); ensureValidState(); return; }
    const roomMatch=hash.match(/(?:^|&)room=([^&]+)/);
    if(roomMatch) setTimeout(()=>joinRoom(roomMatch[1]),800);
    const v3=localStorage.getItem(LS_V3);
    if(v3){ restoreSnapshot(v3); undoStack=[]; redoStack=[]; updateUndoButtons(); ensureValidState(); return; }
    const v2=localStorage.getItem(LS_V2);
    if(v2){ restoreSnapshot(migrateV2(v2)); persist(); undoStack=[]; redoStack=[]; updateUndoButtons(); ensureValidState(); return; }
    const v1=localStorage.getItem(LS_V1);
    if(v1){ const arr=JSON.parse(v1); if(Array.isArray(arr)){ state.pages[0].blocks=arr; persist(); ensureValidState(); return; } }
  }catch(e){ console.error('NOVA restore failed',e); }
  state.pages=[{id:uid('p'),name:'Slide 1',blocks:defaultDemo()}];
  state.currentPageId=state.pages[0].id;
  ensureValidState();
  persist();
}

/* ── Collaboration (PeerJS + BroadcastChannel) ── */
function genRoomCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join(''); }
function initBroadcastChannel(){
  if(collab.bc) return;
  try{
    collab.bc=new BroadcastChannel('nova-collab');
    collab.bc.onmessage=e=>{ if(e.data?.type==='sync'&&e.data.data) receiveRemoteSnapshot(e.data.data); if(e.data?.type==='presence') updateCollabBadge(e.data.count); };
  }catch(_){}
}
function broadcastState(){
  if(snapshotLock) return;
  clearTimeout(collab.broadcastTimer);
  collab.broadcastTimer=setTimeout(()=>{
    const data=snapshot();
    collab.bc?.postMessage({type:'sync',data});
    collab.connections.forEach(c=>{ try{ c.send({type:'sync',data}); }catch(_){} });
  },300);
}
function receiveRemoteSnapshot(json){
  snapshotLock=true;
  try{ const s=typeof json==='string'?json:JSON.stringify(json); restoreSnapshot(s); }finally{ snapshotLock=false; }
}
function updateCollabBadge(count){
  const badge=$('#collabBadge'),dot=$('#collabDot'),status=$('#collabStatus');
  if(!badge) return;
  const n=count||collab.online;
  if(collab.room||n>1){ badge.classList.remove('hidden'); dot.classList.add('online'); status.textContent=`${n} online`; }
  else if(collab.room){ badge.classList.remove('hidden'); dot.classList.add('online'); status.textContent=collab.isHost?'Hosting':'Connected'; }
  else{ badge.classList.add('hidden'); dot.classList.remove('online'); status.textContent='Offline'; }
}
function setupPeerConnection(conn){
  collab.connections.push(conn);
  conn.on('data',d=>{ if(d?.type==='sync') receiveRemoteSnapshot(d.data); });
  conn.on('close',()=>{ collab.connections=collab.connections.filter(c=>c!==conn); collab.online=Math.max(1,collab.connections.length+1); updateCollabBadge(); });
  collab.online=collab.connections.length+1; updateCollabBadge();
}
function hostRoom(){
  const code=genRoomCode(); collab.room=code; collab.isHost=true; initBroadcastChannel();
  if(typeof Peer==='undefined'){ alert('PeerJS not loaded'); return; }
  if(collab.peer) collab.peer.destroy();
  collab.peer=new Peer(code);
  collab.peer.on('open',()=>{ updateCollabBadge(); renderLeftPanel(); });
  collab.peer.on('connection',conn=>{ conn.on('open',()=>setupPeerConnection(conn)); });
  collab.peer.on('error',e=>console.warn('Peer error',e));
  location.hash=`room=${code}`;
}
function joinRoom(code){
  code=String(code||'').trim().toUpperCase(); if(!code) return;
  collab.room=code; collab.isHost=false; initBroadcastChannel();
  if(typeof Peer==='undefined'){ alert('PeerJS not loaded'); return; }
  if(collab.peer) collab.peer.destroy();
  collab.peer=new Peer();
  collab.peer.on('open',()=>{
    const conn=collab.peer.connect(code); conn.on('open',()=>setupPeerConnection(conn));
    updateCollabBadge(); renderLeftPanel();
  });
  collab.peer.on('error',e=>console.warn('Peer error',e));
  location.hash=`room=${code}`;
}
function leaveRoom(){
  collab.connections.forEach(c=>c.close()); collab.connections=[];
  if(collab.peer){ collab.peer.destroy(); collab.peer=null; }
  collab.room=null; collab.isHost=false; collab.online=1; updateCollabBadge(); renderLeftPanel();
}
function copyShareLink(){
  const url=location.origin+location.pathname+(collab.room?`#room=${collab.room}`:'');
  navigator.clipboard?.writeText(url).then(()=>alert('Share link copied!')).catch(()=>prompt('Copy link:',url));
}

/* ── IndexedDB Cloud Versions ── */
function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true}); };
    req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
  });
}
async function saveCloudVersion(name){
  const db=await idbOpen();
  const entry={name:name||`Version ${new Date().toLocaleString()}`,ts:Date.now(),data:snapshot()};
  await new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).add(entry); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  const all=await listCloudVersions(); if(all.length>20){ const db2=await idbOpen(); const old=all.slice(20); for(const o of old){ await new Promise(r=>{ const tx=db2.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(o.id); tx.oncomplete=r; }); } }
  renderRightPanel();
}
async function listCloudVersions(){
  const db=await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const req=tx.objectStore(IDB_STORE).getAll(); req.onsuccess=()=>res((req.result||[]).sort((a,b)=>b.ts-a.ts)); req.onerror=()=>rej(req.error); });
}
async function restoreCloudVersion(id){
  const db=await idbOpen();
  const entry=await new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const req=tx.objectStore(IDB_STORE).get(id); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
  if(entry?.data) commit(()=>restoreSnapshot(entry.data));
}
async function deleteCloudVersion(id){
  const db=await idbOpen();
  await new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  renderRightPanel();
}
function startAutoSnapshot(){
  clearInterval(autoSnapshotTimer);
  if(state.cloud.autoSnapshot) autoSnapshotTimer=setInterval(()=>saveCloudVersion('Auto-snapshot'),5*60*1000);
}

/* ── GSAP Animations ── */
function getBlockAnim(blockId){ const b=blocks().find(x=>x.id===blockId)||state.pages.flatMap(p=>p.blocks).find(x=>x.id===blockId); return b?.props?.anim||DEFAULT_ANIM; }
function animFromVars(preset){
  const map={fadeUp:{opacity:0,y:40},fadeIn:{opacity:0},slideLeft:{opacity:0,x:-60},slideRight:{opacity:0,x:60},scaleIn:{opacity:0,scale:.85},blurIn:{opacity:0,filter:'blur(12px)'}};
  return map[preset]||map.fadeUp;
}
function animToVars(from){
  const to={opacity:1,duration:0.8,ease:'power2.out'};
  if('y' in from) to.y=0; if('x' in from) to.x=0; if('scale' in from) to.scale=1; if('filter' in from) to.filter='blur(0px)';
  return to;
}
function runBlockAnimations(){
  if(!theme().gsapEnabled||typeof gsap==='undefined') return;
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.getAll().forEach(st=>st.kill());
  $$('#canvas .block').forEach((el,i)=>{
    const anim=getBlockAnim(el.dataset.id);
    if(!anim||anim.preset==='none') return;
    const target=el.querySelector('section')||el;
    if(anim.preset==='stagger'){
      const kids=target.children;
      if(!kids.length) return;
      gsap.set(kids,{opacity:0,y:24});
      const cfg={opacity:1,y:0,duration:anim.duration,delay:anim.delay,ease:anim.ease,stagger:.12};
      if(previewMode||presentMode) gsap.to(kids,cfg);
      else gsap.to(kids,{...cfg,scrollTrigger:{trigger:target,start:'top 85%'}});
      return;
    }
    const from=animFromVars(anim.preset);
    gsap.set(target,from);
    const to={...animToVars(from),duration:anim.duration,delay:anim.delay+(previewMode||presentMode?i*.08:0),ease:anim.ease};
    if(previewMode||presentMode) gsap.to(target,to);
    else gsap.to(target,{...to,scrollTrigger:{trigger:target,start:'top 85%',toggleActions:'play none none none'}});
  });
}

/* ── Web Import ── */
function importHtmlBlock(html){
  commit(()=>{ const b=mkBlock('html',{html:sanitizeHtml(html)}); blocks().push(b); selectedId=b.id; });
}
async function importFromUrl(url){
  const u=String(url||'').trim(); if(!u) return;
  try{
    const res=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`);
    const text=await res.text();
    const doc=new DOMParser().parseFromString(text,'text/html');
    importHtmlBlock(doc.body?.innerHTML||text);
  }catch(e){ alert('Import failed: '+e.message); }
}
function smartParseHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const newBlocks=[];
  const h1=doc.querySelector('h1');
  if(h1) newBlocks.push(mkBlock('heading',{title:h1.textContent.trim(),eyebrow:'',body:doc.querySelector('p')?.textContent?.trim()||''}));
  const img=doc.querySelector('img');
  if(img&&doc.querySelector('p')) newBlocks.push(mkBlock('hero',{title:h1?.textContent?.trim()||'Imported',body:doc.querySelector('p').textContent.trim(),image:img.src,eyebrow:'Import'}));
  const table=doc.querySelector('table');
  if(table){
    const cols=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    const rows=[...table.querySelectorAll('tbody tr')].map(tr=>{
      const cells=[...tr.querySelectorAll('td')];
      return {icon:'grid',name:cells[0]?.textContent?.trim()||'Row',values:cells.slice(1).map(c=>c.textContent.trim())};
    });
    if(cols.length) newBlocks.push(mkBlock('table',{columns:cols,rows,prices:cols.map(()=>'')}));
  }
  if(!newBlocks.length) newBlocks.push(mkBlock('html',{html:sanitizeHtml(html)}));
  commit(()=>{ blocks().push(...newBlocks); selectedId=newBlocks[0].id; });
}

function hasOpenAIKey(){ return !!localStorage.getItem(LS_OPENAI); }
function updateAiModal(){

  if(wrap){ wrap.classList.toggle('hidden',!hasOpenAIKey()); if(hasOpenAIKey()) $('#aiUseOpenAI').checked=true; }

async function callOpenAIDeck(topic,audience,goal,style){
  const key=localStorage.getItem(LS_OPENAI);
  const model=state.cloud.openaiModel||'gpt-4o-mini';
  const sys='You are a presentation layout generator. Return ONLY valid JSON matching this schema: {"pages":[{"name":"string","blocks":[{"type":"hero|heading|badges|stats|table|pricing|faq|timeline|cta|testimonial|video|logos|divider|html","props":{}}]}]}. Use NOVA widget types. Keep props minimal but complete.';
  const user=`Topic: ${topic}. Audience: ${audience}. Goal: ${goal}. Style accent: ${style}. Generate 4-5 slides.`;
  const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${key}`},body:JSON.stringify({model,messages:[{role:'system',content:sys},{role:'user',content:user}],temperature:.7})});
  if(!res.ok) throw new Error('API error');
  const data=await res.json();
  const text=data.choices?.[0]?.message?.content||'';
  const jsonMatch=text.match(/\{[\s\S]*\}/);
  if(!jsonMatch) throw new Error('No JSON in response');
  return JSON.parse(jsonMatch[0]);
}
function applyAIDeckLayout(layout,style){
  const slides=(layout.pages||[]).map(pg=>({
    id:uid('p'),name:pg.name||'Slide',
    blocks:(pg.blocks||[]).filter(b=>WIDGETS[b.type]).map(b=>mkBlock(b.type,{...b.props,accent:style}))
  }));
  if(!slides.length) return false;
  state.pages=slides; state.currentPageId=slides[0].id; state.theme.accent=style; selectedId=null;
  return true;
}
function generateAIDeckRuleBody(style){
  const topic=$('#aiTopic').value.trim()||'Your product';
  const audience=$('#aiAudience').value.trim()||'Decision makers';
  const goal=$('#aiGoal').value;
  const acc=()=>({accent:style});
  const slides=[];
  slides.push({name:'Opening',blocks:[mkBlock('hero',{eyebrow:goal.toUpperCase(),title:topic,body:`Crafted for ${audience}.`,cta:goal==='convert'?'Get started':goal==='pitch'?'View deck':'Learn more',accent:style}),mkBlock('stats',acc()),mkBlock('logos',acc())]});
  slides.push({name:'Story',blocks:[mkBlock('heading',{eyebrow:'Overview',title:`Why ${topic} matters`,body:`A focused narrative for ${audience}.`,accent:style}),mkBlock('badges',acc()),mkBlock('testimonial',acc())]});
  if(goal==='pitch'||goal==='convert') slides.push({name:'Offer',blocks:[mkBlock('pricing',acc()),mkBlock('faq',acc())]});
  else slides.push({name:'Details',blocks:[mkBlock('timeline',acc()),mkBlock('video',acc())]});
  slides.push({name:'Close',blocks:[mkBlock('cta',{title:goal==='convert'?`Start with ${topic}`:`Explore ${topic}`,body:`Built for ${audience}.`,button:goal==='convert'?'Sign up now':'Contact us',accent:style})]});
  state.pages=slides.map(s=>({id:uid('p'),name:s.name,blocks:s.blocks})); state.currentPageId=state.pages[0].id; state.theme.accent=style; selectedId=null;
}
function generateAIDeckRule(){
  const style=$('#aiStyle').value;
  commit(()=>generateAIDeckRuleBody(style));
  $('#aiModal').classList.add('hidden');
}
async function generateAIDeck(){
  const spinner=$('#aiSpinner'),label=$('#aiGenLabel');
  const useAI=$('#aiUseOpenAI')?.checked&&hasOpenAIKey();
  if(useAI){
    spinner?.classList.remove('hidden'); label.textContent='Generating…';
    try{
      const layout=await callOpenAIDeck($('#aiTopic').value.trim()||'Product',$('#aiAudience').value.trim()||'Audience',$('#aiGoal').value,$('#aiStyle').value);
      const style=$('#aiStyle').value;
      commit(()=>{ if(!applyAIDeckLayout(layout,style)) generateAIDeckRuleBody(style); });
    }catch(_){ generateAIDeckRule(); }
    finally{ spinner?.classList.add('hidden'); label.textContent='Generate deck'; }
  } else generateAIDeckRule();
  $('#aiModal').classList.add('hidden');
}

function updateDevicePreview(){
  const dev=currentDevice();
  const inner=$('#canvasInner');
  const frame=$('#deviceFrame');
  const scaler=$('#deviceScaler');
  const viewport=$('#deviceViewport');
  const meta=$('#deviceMeta');
  if(!inner||!frame||!scaler) return;
  inner.style.maxWidth=dev.width+'px';
  inner.classList.remove('dev-desktop','dev-tablet','dev-mobile');
  inner.classList.add('dev-'+dev.key);
  frame.classList.toggle('is-sim',!!dev.frame&&!previewMode&&!presentMode);
  frame.classList.toggle('is-mobile',dev.key==='mobile'&&!previewMode&&!presentMode);
  frame.classList.toggle('is-tablet',dev.key==='tablet'&&!previewMode&&!presentMode);
  frame.style.width=dev.frame&&!previewMode&&!presentMode?dev.width+'px':'100%';
  meta?.classList.toggle('hidden-meta',!dev.frame||previewMode||presentMode);
  const badge=$('#deviceBadge');
  if(badge) badge.innerHTML=`<strong>${dev.label}</strong> · ${dev.width}×${dev.height}`;
  $$('#deviceGroup [data-dev]').forEach(b=>b.classList.toggle('active',b.dataset.dev===dev.key));
  if(previewMode||presentMode||!dev.frame){
    scaler.style.transform='none';
    scaler.style.width='100%';
    $('#deviceScale')&&( $('#deviceScale').textContent='Full width');
    return;
  }
  const pad=32;
  const availW=Math.max(240,(viewport?.clientWidth||window.innerWidth)-pad);
  const availH=Math.max(320,(viewport?.clientHeight||window.innerHeight)-pad);
  const frameH=Math.min(dev.height,Math.max(480,availH));
  frame.style.minHeight=frameH+'px';
  const scale=Math.min(1,availW/dev.width,availH/frameH);
  scaler.style.width=dev.width+'px';
  scaler.style.transform=`scale(${scale})`;
  const scaleEl=$('#deviceScale');
  if(scaleEl) scaleEl.textContent=scale>=.995?'100% fit':`${Math.round(scale*100)}% fit`;
}

function addBlock(type,index){
  commit(()=>{ const b=mkBlock(type); index==null?blocks().push(b):blocks().splice(index,0,b); selectedId=b.id; });
}
function act(action,id){
  const arr=blocks(); const i=arr.findIndex(b=>b.id===id); if(i<0) return;
  commit(()=>{
    if(action==='del'){ arr.splice(i,1); if(selectedId===id) selectedId=null; }
    if(action==='dup'){ const c=structuredClone(arr[i]); c.id=uid(); arr.splice(i+1,0,c); selectedId=c.id; }
    if(action==='up'&&i>0) arr.splice(i-1,0,arr.splice(i,1)[0]);
    if(action==='down'&&i<arr.length-1) arr.splice(i+1,0,arr.splice(i,1)[0]);
  });
}

  const prevPage=state.currentPageId; const prevDevKey=state.deviceKey;
  state.deviceKey='desktop'; state.device=1280; for(let i=0;i<state.pages.length;i++){

    presentReturnPageId=state.currentPageId;
    presentIndex=Math.max(0,state.pages.findIndex(p=>p.id===state.currentPageId));
    state.currentPageId=state.pages[presentIndex].id;

  $('#exitPresent').classList.toggle('hidden',!on);

$('#rightPanel').addEventListener('input',e=>{
  const el=e.target.closest('[data-prop]');
  if(el&&rightTab==='properties'){ const b=blocks().find(x=>x.id===selectedId); if(!b) return;
    const key=el.dataset.prop,idx=el.dataset.idx,sub=el.dataset.sub,j=el.dataset.j;
    mutate(()=>{
      if(idx===undefined) b.props[key]=el.value;
      else if(sub==='features') b.props[key][+idx][sub]=el.value.split('\n').filter(Boolean);
      else if(j!==undefined) b.props[key][+idx][sub][+j]=el.value;
      else if(sub!==undefined) b.props[key][+idx][sub]=el.value;
      else b.props[key][+idx]=el.value;
    });
    const host=document.querySelector(`.block[data-id="${b.id}"] > section`); if(host) host.outerHTML=renderWidget(b.type,b.props);
    const preset=$('#blkAnimPreset'),dur=$('#blkAnimDur'),delay=$('#blkAnimDelay');
    if(preset||dur||delay) mutate(()=>{ b.props.anim={...b.props.anim,preset:preset?.value||b.props.anim.preset,duration:+(dur?.value||b.props.anim.duration),delay:+(delay?.value||b.props.anim.delay)}; });
    return;
  }
  if(rightTab==='design'){
    mutate(()=>{ state.theme.accent=$('#thAccent').value; state.theme.font=$('#thFont').value; state.theme.radius=$('#thRadius').value; state.theme.animations=$('#thAnim').checked; applyThemeCSS(); });
  }
  if(rightTab==='motion'){
    mutate(()=>{
      state.theme.gsapEnabled=$('#thGsap')?.checked??state.theme.gsapEnabled;
      const b=blocks().find(x=>x.id===selectedId);
      if(b){ b.props.anim={preset:$('#motPreset')?.value||'fadeUp',duration:+($('#motDur')?.value||0.8),delay:+($('#motDelay')?.value||0),ease:$('#motEase')?.value||'power2.out'}; }
    });
  }
  if(rightTab==='cms'){
    mutate(()=>{ state.cms.inline=$('#cmsInline')?.value||''; state.cms.url=$('#cmsUrl')?.value||''; state.cms.refreshInterval=+($('#cmsRefresh')?.value||0); });
    setupCmsRefresh();
  }
  if(rightTab==='seo'){
    mutate(()=>{ state.seo.title=$('#seoTitle').value; state.seo.description=$('#seoDesc').value; state.seo.ogImage=$('#seoOg').value; });
  }
  if(rightTab==='cloud'){
    const keyEl=$('#openaiKey');
    if(keyEl){ const v=keyEl.value.trim(); if(v) localStorage.setItem(LS_OPENAI,v); else localStorage.removeItem(LS_OPENAI); updateAiModal(); }
    if($('#openaiModel')) state.cloud.openaiModel=$('#openaiModel').value;
    if($('#cloudAuto')){ state.cloud.autoSnapshot=$('#cloudAuto').checked; startAutoSnapshot(); }
  }
});

$('#rightPanel').addEventListener('click',async e=>{

  if(e.target.id==='btnCmsSample'){ mutate(()=>{ state.cms.inline=JSON.stringify(CMS_SAMPLE,null,2); state.cms.data=CMS_SAMPLE; }); renderCMS(); }
  if(e.target.id==='btnCmsFetch'){ parseCmsInline(); await fetchCmsUrl(); }
  if(e.target.id==='btnCmsApply'){ parseCmsInline(); applyCmsToDeck(); }
  if(e.target.id==='btnCloudSave'){ const n=prompt('Version name',''); await saveCloudVersion(n||undefined); }
  if(e.target.id==='btnImportJson') $('#importJsonFile')?.click();
  const rid=e.target.closest('[data-vrestore]'); if(rid) return restoreCloudVersion(+rid.dataset.vrestore);
  const did=e.target.closest('[data-vdel]'); if(did) return deleteCloudVersion(+did.dataset.vdel);
  const eid=e.target.closest('[data-vexport]');
  if(eid){ const versions=await listCloudVersions(); const v=versions.find(x=>x.id===+eid.dataset.vexport); if(v) downloadBlob(v.data,(v.name||'version')+'.json','application/json'); }
});

$('#canvasWrap').addEventListener('click',e=>{
  if(e.target.id==='btnLoadDemo') commit(()=>{ currentPage().blocks=defaultDemo(); selectedId=null; });
  if(e.target.id==='btnOpenTemplates'){ leftTab='templates'; $$('#leftTabs .tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.ltab==='templates')); renderLeftPanel(); }
  if(e.target.id==='btnOpenAI'){ updateAiModal(); $('#aiModal').classList.remove('hidden'); }
});
$('#canvas').addEventListener('click',e=>{
  if(previewMode||presentMode) return;
  const btn=e.target.closest('[data-act]'); const blk=e.target.closest('.block'); if(!blk) return;
  if(btn){ e.stopPropagation(); return act(btn.dataset.act,blk.dataset.id); }
  selectedId=blk.dataset.id; renderCanvas(); renderRightPanel();
});

$('#leftPanel').addEventListener('click',e=>{
  const card=e.target.closest('[data-type]'); if(card&&leftTab==='elements') return addBlock(card.dataset.type);
  const tpl=e.target.closest('[data-tpl]'); if(tpl) return applyTemplate(tpl.dataset.tpl,tpl.dataset.mode);
  if(e.target.id==='openAiModal'){ updateAiModal(); $('#aiModal').classList.remove('hidden'); }
  if(e.target.id==='btnImportHtml'){ const html=$('#importHtml')?.value; if(html) importHtmlBlock(html); }
  if(e.target.id==='btnImportUrl'){ importFromUrl($('#importUrl')?.value); }
  if(e.target.id==='btnSmartParse'){ const html=$('#importHtml')?.value; if(html) smartParseHtml(html); }
  if(e.target.id==='btnHostRoom') hostRoom();
  if(e.target.id==='btnJoinRoom') joinRoom($('#joinCode')?.value);
  if(e.target.id==='btnShareLink') copyShareLink();
  if(e.target.id==='btnLeaveRoom') leaveRoom();
  const row=e.target.closest('.layer-row'); if(!row||leftTab!=='layers') return;
  const id=row.dataset.id; const lact=e.target.closest('[data-lact]');
  if(lact){
    if(lact.dataset.lact==='sel'){ selectedId=id; renderAll(); }
    if(lact.dataset.lact==='dup') act('dup',id);
    if(lact.dataset.lact==='del') act('del',id);
    if(lact.dataset.lact==='vis'){ commit(()=>{ const b=blocks().find(x=>x.id===id); if(b) b.props.visible=b.props.visible===false; }); }
    return;
  }
  selectedId=id; renderAll();
});

$('#slideStrip').addEventListener('click',e=>{
  const tab=e.target.closest('[data-pid]'); if(tab){ commit(()=>{ state.currentPageId=tab.dataset.pid; selectedId=null; }); return; }
  if(e.target.id==='addSlide') commit(()=>addPage());
  if(e.target.id==='dupSlide') commit(()=>duplicatePage(state.currentPageId));
  if(e.target.id==='renSlide'){ const p=currentPage(); const n=prompt('Slide name',p.name); if(n) commit(()=>{ p.name=n.trim()||p.name; }); }
  if(e.target.id==='delSlide') commit(()=>deletePage(state.currentPageId));
});

$$('#leftTabs [data-ltab]').forEach(btn=>btn.addEventListener('click',()=>{ leftTab=btn.dataset.ltab; $$('#leftTabs .tab-btn').forEach(b=>b.classList.toggle('active',b===btn)); renderLeftPanel(); }));
$$('#rightTabs [data-rtab]').forEach(btn=>btn.addEventListener('click',()=>{ rightTab=btn.dataset.rtab; $$('#rightTabs .tab-btn').forEach(b=>b.classList.toggle('active',b===btn)); renderRightPanel(); }));

$$('#deviceGroup [data-dev]').forEach(btn=>btn.addEventListener('click',()=>{ state.deviceKey=btn.dataset.dev; const dev=currentDevice(); state.device=dev.width; renderCanvas(); }));

$('#btnUndo').addEventListener('click',undo);
$('#btnRedo').addEventListener('click',redo);
$('#btnGrid').addEventListener('click',()=>{ state.grid=!state.grid; document.body.classList.toggle('grid-on',state.grid); $('#btnGrid').classList.toggle('text-volt-300',state.grid); });
$('#btnPreview').addEventListener('click',()=>setPreview(!previewMode));
$('#btnPresent').addEventListener('click',()=>setPresent(!presentMode));
$('#exitPreview').addEventListener('click',()=>setPreview(false));
$('#exitPresent').addEventListener('click',()=>setPresent(false));
$('#btnSave').addEventListener('click',()=>{ persist(); const b=$('#btnSave'),t=b.textContent; b.textContent='✓ Saved'; setTimeout(()=>b.textContent=t,1400); });
$('#btnClear').addEventListener('click',()=>{ if(confirm('Clear all blocks on this slide?')) commit(()=>{ currentPage().blocks=[]; selectedId=null; }); });
$('#btnCloudQuick').addEventListener('click',async()=>{ rightTab='cloud'; $$('#rightTabs .tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.rtab==='cloud')); await saveCloudVersion(); const b=$('#btnCloudQuick'); b.textContent='✓'; setTimeout(()=>b.textContent='☁',1200); });
$$('[data-export]').forEach(btn=>btn.addEventListener('click',()=>{ if(btn.dataset.export==='html') exportHTML(); if(btn.dataset.export==='json') exportJSON(); if(btn.dataset.export==='png') exportPNG(); if(btn.dataset.export==='pdf') exportPDF(); if(btn.dataset.export==='share') exportShareState(); }));
$('#aiCancel').addEventListener('click',()=>$('#aiModal').classList.add('hidden'));
$('#aiGenerate').addEventListener('click',generateAIDeck);

document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey&&e.shiftKey&&e.key==='z')||(e.ctrlKey&&e.key==='y')){ e.preventDefault(); redo(); }
  if(e.ctrlKey&&e.key==='d'&&selectedId){ e.preventDefault(); act('dup',selectedId); }
  if(e.ctrlKey&&e.key==='s'){ e.preventDefault(); persist(); }
  if(e.key==='Delete'&&selectedId&&!previewMode&&!presentMode) act('del',selectedId);
  if(e.key==='Escape'){ setPreview(false); setPresent(false); }
  if(presentMode){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); presentNav(1); }
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); presentNav(-1); }
  }
});

if(window._canvasSort) window._canvasSort.destroy();
window._canvasSort=Sortable.create($('#canvas'),{
  group:{name:'nova',pull:true,put:true}, handle:'.handle, .block', filter:'[data-act], input, textarea, select, .faq-toggle, iframe',
  animation:240, ghostClass:'sortable-ghost', dragClass:'sortable-drag',
  onAdd(evt){ const type=evt.item.dataset.type; evt.item.remove(); if(WIDGETS[type]) addBlock(type,evt.newIndex); },
  onEnd(evt){ if(evt.from!==evt.to) return; const {oldIndex,newIndex}=evt; if(oldIndex===newIndex) return; commit(()=>{ blocks().splice(newIndex,0,blocks().splice(oldIndex,1)[0]); }); }
});

applyThemeCSS(); initBroadcastChannel();
let _deviceResizeRaf=0;
function scheduleDeviceReflow(){ cancelAnimationFrame(_deviceResizeRaf); _deviceResizeRaf=requestAnimationFrame(updateDevicePreview); }
window.addEventListener('resize',scheduleDeviceReflow,{passive:true});
window.addEventListener('orientationchange',scheduleDeviceReflow,{passive:true});
if(window.ResizeObserver){ new ResizeObserver(scheduleDeviceReflow).observe($('#deviceViewport')||$('#canvasWrap')); }
try{
  restore(); ensureValidState();
  renderAll(); pushHistory(); updateAiModal(); startAutoSnapshot();
}catch(err){
  console.error('NOVA boot failed',err);
  state.pages=[{id:uid('p'),name:'Slide 1',blocks:defaultDemo()}];
  state.currentPageId=state.pages[0].id;
  ensureValidState();
  renderAll();
  $('#leftPanel').innerHTML=`<div class="rounded-xl border border-rose-400/30 bg-rose-500/10 p-3 text-[11px] text-rose-200">Builder recovered from an error. Demo deck loaded — refresh if panels stay empty.</div>`;
}
$('#importJsonFile')?.addEventListener('change',e=>{
  const file=e.target.files?.[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{ try{ restoreSnapshot(reader.result); persist(); }catch(_){ alert('Invalid JSON file'); } e.target.value=''; };
  reader.readAsText(file);
});

</script>
</body>
</html>
