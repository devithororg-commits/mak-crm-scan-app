name: Deploy to apptesting.in

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apptesting-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-ftp:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dist for FTP upload
        run: npm run build

      - name: Preflight FTP secrets
        env:
          APPTESTING_FTP_PASS: ${{ secrets.APPTESTING_FTP_PASS }}
          HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASS }}
        run: |
          if [ -n "$APPTESTING_FTP_PASS" ]; then echo "APPTESTING_FTP_PASS is set"; else echo "APPTESTING_FTP_PASS is missing"; fi
          if [ -n "$HOSTINGER_PASS" ]; then echo "HOSTINGER_PASS is set"; else echo "HOSTINGER_PASS is missing"; fi
          if [ -z "$APPTESTING_FTP_PASS" ] && [ -z "$HOSTINGER_PASS" ]; then
            echo "Add HOSTINGER_PASS to repo secrets: https://github.com/devithororg-commits/mak-crm-scan-app/settings/secrets/actions"
            exit 1
          fi

      - name: Upload critical files first (hotfix)
        env:
          APPTESTING_FTP_HOST: ${{ secrets.APPTESTING_FTP_HOST }}
          APPTESTING_FTP_USER: ${{ secrets.APPTESTING_FTP_USER }}
          APPTESTING_FTP_PASS: ${{ secrets.APPTESTING_FTP_PASS }}
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASS }}
        run: python3 .github/scripts/deploy-hotfix.py

      - name: Upload full site to apptesting.in (FTP)
        env:
          APPTESTING_FTP_HOST: ${{ secrets.APPTESTING_FTP_HOST }}
          APPTESTING_FTP_USER: ${{ secrets.APPTESTING_FTP_USER }}
          APPTESTING_FTP_PASS: ${{ secrets.APPTESTING_FTP_PASS }}
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASS }}
        run: |
          chmod +x .github/scripts/deploy-apptesting.sh
          .github/scripts/deploy-apptesting.sh || echo "Full FTP deploy skipped or failed — hotfix already uploaded critical files"

      - name: Verify homepage and builder
        run: |
          home=$(curl -sS --max-time 25 "https://apptesting.in/" || true)
          if echo "$home" | grep -q "f8fafc\|--bg:"; then
            echo "✅ Light theme landing page is live on apptesting.in"
          else
            echo "⚠️ Homepage may still be cached or FTP pending"
          fi
          body=$(curl -sS --max-time 25 "https://apptesting.in/builder.html" || true)
          if echo "$body" | grep -q "const \$\$="; then
            echo "✅ builder.html is live"
            exit 0
          fi
          echo "builder.html still outdated — check FTP"
          exit 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: [deploy-ftp, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check apptesting.in
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "https://apptesting.in/" || echo "000")
          echo "apptesting.in HTTP $code"
          if [ "$code" = "200" ]; then
            echo "✅ https://apptesting.in/ is live"
            exit 0
          fi
          pages_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "https://devithororg-commits.github.io/mak-crm-scan-app/" || echo "000")
          echo "GitHub Pages HTTP $pages_code"
          if [ "$pages_code" = "200" ]; then
            echo "⚠️ App is live on GitHub Pages. Point apptesting.in DNS to GitHub Pages or add HOSTINGER_PASS secret for FTP deploy."
          fi
          exit 0
