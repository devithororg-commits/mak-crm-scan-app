name: Fast hotfix to apptesting.in

on:
  push:
    branches: [master]
    paths:
      - 'public/index.html'
      - 'public/hub.html'
      - 'public/sw.js'
      - 'public/.htaccess'
      - 'public/aurora-ppt.html'
      - 'public/aurora-ppt/index.html'
      - 'public/assets/aurora-home.*'
      - 'public/assets/aurora-toolhub.*'
      - 'public/assets/aurora-ppt-spa.*'
      - 'public/assets/editorial-botanical-Bu_MnSHi.jpg'
      - '.github/scripts/deploy-hotfix.py'
  workflow_dispatch:

concurrency:
  group: apptesting-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dist
        run: npm run build

      - name: Upload index + htaccess via FTP
        env:
          APPTESTING_FTP_HOST: ${{ secrets.APPTESTING_FTP_HOST }}
          APPTESTING_FTP_USER: ${{ secrets.APPTESTING_FTP_USER }}
          APPTESTING_FTP_PASS: ${{ secrets.APPTESTING_FTP_PASS }}
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASS }}
        run: python3 .github/scripts/deploy-hotfix.py

      - name: Verify PPT editor live
        run: |
          body=$(curl -sS --max-time 25 "https://apptesting.in/aurora-ppt.html?t=$(date +%s)" || true)
          if echo "$body" | grep -q "aurora-ppt-spa.js"; then
            echo "✅ aurora-ppt.html SPA entry is live"
            exit 0
          fi
          echo "⚠️ PPT page not updated yet"
          exit 0
